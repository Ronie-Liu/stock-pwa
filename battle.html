<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A股投资情报站 · 全市场多空博弈</title>
  <style>
    :root { color-scheme: dark; --bull:#ef6b78; --bear:#3fc39b; --index:#8d99a8; --resistance:#e3a25c; --support:#6ba6f2; --line:#16202c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0a0f16; color: #dfe8f2; font: 13px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
    .app { display: flex; height: 100%; min-height: 0; }
    .side { flex: 0 0 178px; display: flex; flex-direction: column; min-height: 0; padding: 10px 8px 8px; background: #0b1119; border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 8px; padding: 0 6px 10px; }
    .logo { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #cfe9dc; background: linear-gradient(135deg, #2f5d4c, #1d3a31); }
    .brand b { display: block; font-size: 13px; letter-spacing: .4px; }
    .brand small { display: block; color: #4f6075; font-size: 10px; letter-spacing: 1.5px; }
    .nav { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .nav-group { padding: 10px 8px 4px; color: #4f6075; font-size: 10px; letter-spacing: 1.5px; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: #9fb0c2; font: 12px/1.4 inherit; text-align: left; cursor: pointer; }
    .nav-item:hover { background: #121c27; color: #c8d8e8; }
    .nav-item.active { background: #16281f; color: #d9efe4; box-shadow: inset 2px 0 0 #3f6b58; }
    .nav-item[data-status]::after { content: attr(data-status); flex: 0 0 auto; padding: 0 5px; border: 1px solid #22303f; border-radius: 8px; color: #5e7186; font-size: 9px; }
    .side-foot { padding: 6px 8px 2px; border-top: 1px solid var(--line); color: #42536a; font-size: 10px; }
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 12px 6px; }
    .topbar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .crumb { color: #5b6c80; font-size: 11px; }
    .crumb b { color: #c8d8e8; font-weight: 500; }
    .meta { margin-left: auto; color: #5b6c80; font-size: 10px; }
    .subbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .subtabs { display: flex; gap: 2px; padding: 2px; border: 1px solid #1b262f; border-radius: 7px; background: #0d151e; }
    .subtab { display: flex; align-items: center; gap: 4px; padding: 3px 9px; border: 0; border-radius: 5px; background: none; color: #8b9caf; font: 11px/1.4 inherit; cursor: pointer; }
    .subtab.active { background: #17242f; color: #d3e4f2; }
    .subtab[data-status]::after { content: attr(data-status); color: #54677c; font-size: 9px; }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    .chips + .chips { margin-left: 0; }
    .chips button { padding: 3px 8px; border: 1px solid #22303f; border-radius: 6px; background: #111b26; color: #9fb0c2; font: 11px/1.4 inherit; cursor: pointer; }
    .chips button:hover { border-color: #31465b; color: #d3e4f2; }
    .chips button.selected { border-color: #3f6b58; background: #1d3a31; color: #d6efe2; }
    .module-view { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
    .module-view[hidden] { display: none; }
    .pane { display: flex; flex-direction: column; min-height: 0; }
    .pane.daily { flex: 0 0 24%; }
    .pane.primary { flex: 1 1 auto; }
    .pane.sub { flex: 0 0 20%; }
    .pane-head { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
    .pane-title { color: #9db3c8; font-size: 11px; white-space: nowrap; }
    .pane-meta { margin-left: auto; color: #5b6c80; font-size: 10px; white-space: nowrap; }
    .pane-body { flex: 1 1 auto; min-height: 0; }
    .legend { display: inline-flex; align-items: center; gap: 8px; color: #7f91a6; font-size: 10px; white-space: nowrap; }
    .legend span { display: inline-flex; align-items: center; }
    .legend i { display: inline-block; width: 10px; height: 2px; margin-right: 3px; }
    .empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .empty-card { max-width: 420px; padding: 26px 28px; border: 1px dashed #22303f; border-radius: 12px; background: #0c141d; text-align: center; }
    .empty-card b { font-size: 15px; }
    .empty-card p { margin: 8px 0 10px; color: #7f91a6; font-size: 12px; }
    .empty-card span { color: #4f6075; font-size: 11px; }
    .tip { min-width: 132px; }
    .tip-title { margin-bottom: 3px; color: #9fb4c9; font-size: 11px; }
    .tip-row { display: flex; justify-content: space-between; gap: 18px; font-size: 11px; line-height: 1.55; }
    .tip-row span { color: #8b9caf; }
    .tip-row b { color: #dfe8f2; font-weight: 500; }
    body.embed .side, body.embed .topbar, body.embed .subtabs { display: none; }
    body.embed .main { padding: 4px 6px 2px; min-height: 100vh; }
    body.embed .subbar { justify-content: flex-end; margin-bottom: 2px; }
    @media (max-width: 780px) {
      html, body { height: auto; min-height: 100%; }
      body { overflow: auto; }
      .app { flex-direction: column; height: auto; min-height: 100%; }
      .side { flex: 0 0 auto; width: 100%; min-width: 0; flex-direction: row; align-items: center; gap: 6px; overflow: hidden; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { flex: 0 0 auto; padding: 0 6px 0 0; }
      .brand small { display: none; }
      .nav { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 4px; overflow-x: auto; }
      .nav-group, .side-foot { display: none; }
      .nav-item { width: auto; padding: 5px 8px; white-space: nowrap; }
      .nav-item[data-status]::after { display: none; }
      .main { min-height: calc(100vh - 48px); padding: 6px 8px 8px; }
      .pane.daily { flex: 0 0 24%; min-height: 110px; }
      .pane.primary { flex: 1 1 auto; min-height: 200px; }
      .pane.sub { flex: 0 0 20%; min-height: 90px; }
      .chips { width: 100%; margin-left: 0; }
      .pane-head .legend { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo">情报</span>
      <div><b>A股投资情报站</b><small>RESEARCH DESK</small></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-group">市场</div>
      <button type="button" class="nav-item active" data-module="battle">全市场多空博弈</button>
      <button type="button" class="nav-item" data-module="sentiment" data-status="待建">指数与情绪</button>
      <button type="button" class="nav-item" data-module="sector" data-status="待建">板块轮动</button>
      <div class="nav-group">研究</div>
      <button type="button" class="nav-item" data-module="stock" data-status="待建">个股诊断</button>
      <button type="button" class="nav-item" data-module="review" data-status="待建">复盘日历</button>
      <div class="nav-group">数据</div>
      <button type="button" class="nav-item" data-module="ops" data-status="待建">采集状态</button>
    </nav>
    <div class="side-foot" id="side-state">数据每 5 分钟更新</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="crumb"><span id="crumb-module">市场</span> / <b id="crumb-page">全市场多空博弈</b></div>
      <div class="meta" id="meta">加载中…</div>
    </div>
    <div class="subbar">
      <div class="subtabs" id="subtabs">
        <button type="button" class="subtab active" data-sub="all">全市场</button>
        <button type="button" class="subtab" data-sub="index" data-status="待建">指数对照</button>
        <button type="button" class="subtab" data-sub="sector" data-status="待建">板块轮动</button>
      </div>
      <div class="chips" id="range-chips">
        <button type="button" data-days="3">近3日</button>
        <button type="button" data-days="5" class="selected">近5日</button>
        <button type="button" data-days="10">近10日</button>
        <button type="button" data-days="30">近30日</button>
        <button type="button" data-days="60">近60日</button>
        <button type="button" data-days="120">近120日</button>
        <button type="button" data-days="250">近250日</button>
      </div>
      <div class="chips" id="period-chips">
        <button type="button" data-period="5m" class="selected">5分钟</button>
        <button type="button" data-period="15m">15分钟</button>
        <button type="button" data-period="30m">30分钟</button>
        <button type="button" data-period="60m">60分钟</button>
      </div>
    </div>
    <section class="module-view" id="view-battle">
      <div class="pane daily">
        <div class="pane-head">
          <span class="pane-title">日线 · 多空力量</span>
          <span class="legend">
            <span><i style="background:#ef6b78"></i>多头</span>
            <span><i style="background:#3fc39b"></i>空头</span>
            <span><i style="background:#8d99a8;height:1px"></i>指数</span>
          </span>
          <span class="pane-meta" id="daily-meta">—</span>
        </div>
        <div class="pane-body" id="daily-chart"></div>
      </div>
      <div class="pane primary">
        <div class="pane-head">
          <span class="pane-title" id="main-title">多空博弈 · 指数对照</span>
          <span class="legend">
            <span><i style="background:#ef6b78"></i>多头</span>
            <span><i style="background:#3fc39b"></i>空头</span>
            <span><i style="background:#8d99a8;height:1px"></i>指数</span>
          </span>
          <span class="pane-meta" id="main-meta">—</span>
        </div>
        <div class="pane-body" id="main-chart"></div>
      </div>
      <div class="pane sub">
        <div class="pane-head">
          <span class="pane-title">阻力 / 支撑</span>
          <span class="legend">
            <span><i style="background:#e3a25c"></i>阻力</span>
            <span><i style="background:#6ba6f2"></i>支撑</span>
          </span>
          <span class="pane-meta" id="sub-meta">—</span>
        </div>
        <div class="pane-body" id="sub-chart"></div>
      </div>
    </section>
    <section class="module-view empty" id="view-empty" hidden>
      <div class="empty-card">
        <b id="empty-title">模块建设中</b>
        <p>该功能模块正在规划，会随数据与策略逐步上线。</p>
        <span>当前可用：市场 · 全市场多空博弈</span>
      </div>
    </section>
  </main>
</div>
<script>
  (function boot() {
    const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
    const script = document.createElement('script');
    script.src = local ? '/echarts.min.js' : 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/echarts.min.js';
    script.onload = () => main();
    script.onerror = () => { document.getElementById('meta').textContent = '图表组件加载失败，请检查网络'; };
    document.head.appendChild(script);
  })();
</script>
<script>
  function main() {
  if (!window.echarts) { document.getElementById('meta').textContent = '图表组件不可用'; return; }
  const DATA_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/today.json';
  const IS_LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';

  const COLORS = { bull: '#ef6b78', bear: '#3fc39b', index: '#8d99a8', resistance: '#e3a25c', support: '#6ba6f2' };
  const PERIOD_LABEL = { '5m': '5 分钟', '30m': '30 分钟', '60m': '60 分钟', '1d': '日线' };
  const MODULES = {
    battle: { group: '市场', name: '全市场多空博弈' },
    sentiment: { group: '市场', name: '指数与情绪' },
    sector: { group: '市场', name: '板块轮动' },
    stock: { group: '研究', name: '个股诊断' },
    review: { group: '研究', name: '复盘日历' },
    ops: { group: '数据', name: '采集状态' }
  };
  const fmt = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 });
  const compact = new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 });
  const clock = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false });

  const dailyChart = echarts.init(document.getElementById('daily-chart'), null, { renderer: 'canvas' });
  const mainChart = echarts.init(document.getElementById('main-chart'), null, { renderer: 'canvas' });
  const subChart = echarts.init(document.getElementById('sub-chart'), null, { renderer: 'canvas' });
  [dailyChart, mainChart, subChart].forEach((chart) => { chart.group = 'battle'; });
  echarts.connect('battle');
  mainChart.on('dataZoom', () => {
    const option = mainChart.getOption();
    const zoom = option && option.dataZoom && option.dataZoom[0];
    if (zoom && Number.isFinite(zoom.start) && Number.isFinite(zoom.end)) {
      state.zoom = { start: zoom.start, end: zoom.end };
    }
  });

  const state = { days: 5, period: '5m', intraday: [], daily: [], start: null, end: null, module: 'battle', zoom: null };
  let cloudPayload = null;
  let busy = false;

  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const num = (v) => (isNum(v) ? fmt.format(v) : '—');
  const pct = (v) => (isNum(v) ? `${v > 0 ? '+' : ''}${v.toFixed(2)}%` : '—');
  const shortTime = (value) => (typeof value === 'string' ? (value.length <= 10 ? value.slice(5) : value.slice(5, 16)) : '');
  const periodLabel = (period) => PERIOD_LABEL[period] || period;

  function tipHTML(title, rows) {
    const body = rows.map(([name, value]) => `<div class="tip-row"><span>${name}</span><b>${value}</b></div>`).join('');
    return `<div class="tip"><div class="tip-title">${title}</div>${body}</div>`;
  }

  function dailyOf(time) {
    const day = String(time || '').slice(0, 10);
    return state.daily.find((row) => row.time.slice(0, 10) === day) || null;
  }

  function tipStyle(formatter) {
    return { trigger: 'axis', confine: true, backgroundColor: '#101a25f2', borderColor: '#2c3d50', padding: [8, 11], textStyle: { color: '#dfe8f2', fontSize: 11 }, formatter };
  }

  function mainTip(params) {
    const index = (Array.isArray(params) ? params[0] : params)?.dataIndex;
    const point = state.intraday[index];
    if (!point) return '';
    const day = dailyOf(point.time);
    const rows = [['多头', num(point.bull)], ['空头', num(point.bear)], ['指数', num(point.index)], ['涨跌', pct(point.index_change)]];
    if (day) rows.push(['当日多头', num(day.bull)], ['当日空头', num(day.bear)]);
    rows.push(['样本', num(point.total)]);
    return tipHTML(shortTime(point.time), rows);
  }

  function dailyTip(params) {
    const index = (Array.isArray(params) ? params[0] : params)?.dataIndex;
    const point = state.intraday[index];
    const day = point ? dailyOf(point.time) : null;
    if (!day) return '';
    return tipHTML(day.time.slice(5, 10), [['多头', num(day.bull)], ['空头', num(day.bear)], ['指数', num(day.index)], ['涨跌', pct(day.index_change)], ['阻力', num(day.resistance)], ['支撑', num(day.support)], ['样本', num(day.total)]]);
  }

  function subTip(params) {
    const index = (Array.isArray(params) ? params[0] : params)?.dataIndex;
    const point = state.intraday[index];
    if (!point) return '';
    return tipHTML(shortTime(point.time), [['阻力', num(point.resistance)], ['支撑', num(point.support)], ['多头', num(point.bull)], ['空头', num(point.bear)]]);
  }

  function labelIndexes(points, isDaily) {
    const starts = [];
    let previous = '';
    points.forEach((point, index) => {
      const day = point.time.slice(0, 10);
      if (day !== previous) { starts.push(index); previous = day; }
    });
    if (isDaily) {
      const step = Math.max(1, Math.ceil(points.length / 7));
      const shown = new Set();
      points.forEach((_, index) => { if (index % step === 0) shown.add(index); });
      return shown;
    }
    const step = starts.length > 24 ? 5 : starts.length > 12 ? 2 : 1;
    return new Set(starts.filter((_, order) => order % step === 0));
  }

  function alignDaily(points, daily) {
    const empty = { bull: [], bear: [], index: [] };
    if (!points.length) return empty;
    const bull = new Array(points.length).fill(null);
    const bear = new Array(points.length).fill(null);
    const index = new Array(points.length).fill(null);
    const byDay = new Map(daily.map((row) => [row.time.slice(0, 10), row]));
    const fill = (position, row) => {
      bull[position] = isNum(row.bull) ? row.bull : null;
      bear[position] = isNum(row.bear) ? row.bear : null;
      index[position] = isNum(row.index) ? row.index : null;
    };
    if (points[0].time.length <= 10) {
      points.forEach((point, position) => {
        const row = byDay.get(point.time.slice(0, 10));
        if (row) fill(position, row);
      });
      return { bull, bear, index };
    }
    /* 日线值只落在当日最后一个时点（收盘 15:00），不在整日铺平，避免出现横线误导。 */
    const last = {};
    points.forEach((point, position) => { last[point.time.slice(0, 10)] = position; });
    daily.forEach((row) => {
      const position = last[row.time.slice(0, 10)];
      if (position !== undefined) fill(position, row);
    });
    return { bull, bear, index };
  }

  function gridPad(width) {
    return width && width < 520 ? { left: 38, right: 42 } : { left: 50, right: 54 };
  }

  function paint() {
    const points = state.intraday;
    if (!points.length) {
      [dailyChart, mainChart, subChart].forEach((chart) => chart.clear());
      return;
    }
    const isDaily = state.period === '1d';
    const shown = labelIndexes(points, isDaily);
    const pad = gridPad(document.getElementById('main-chart').clientWidth);
    const axis = {
      type: 'category', data: points.map((point) => point.time), boundaryGap: false,
      axisLine: { lineStyle: { color: '#26313f' } }, axisTick: { show: false },
      axisLabel: {
        color: '#6f8095', fontSize: 9, interval: 0, hideOverlap: true,
        formatter: (value, index) => (shown.has(index) ? String(value).slice(5, 10) : '')
      },
      axisPointer: {
        show: true, snap: true, lineStyle: { color: '#5f7d74', type: 'dashed' },
        label: { backgroundColor: '#2b423a', color: '#dfe8f2', fontSize: 10, formatter: (params) => shortTime(params.value) }
      }
    };
    const valueAxis = {
      type: 'value', min: 0, splitNumber: 2,
      axisLabel: { color: '#6f8095', fontSize: 9, formatter: (value) => compact.format(value) },
      splitLine: { lineStyle: { color: '#1c2632', type: 'dashed' } }
    };
    const indexAxis = {
      type: 'value', position: 'right', scale: true, splitNumber: 2,
      axisLabel: { color: '#6f8095', fontSize: 9, formatter: (value) => compact.format(value) },
      splitLine: { show: false }
    };
    const aligned = alignDaily(points, state.daily);
    const dailyLine = (name, data, color, extra) => ({
      name, type: 'line', data, showSymbol: true, symbolSize: 3, connectNulls: true,
      lineStyle: { width: 1.5, color }, itemStyle: { color }, animation: false, ...extra
    });
    const line = (name, data, color, extra) => ({
      name, type: 'line', data, showSymbol: false, connectNulls: false,
      lineStyle: { width: 1.5, color }, itemStyle: { color }, animation: false, ...extra
    });
    /* 三图共用同一份分类轴，缩放通过 echarts.connect 同步，保证拖动后日期仍对齐。 */
    const zoom = state.zoom || { start: 0, end: 100 };
    const insideZoom = { type: 'inside', xAxisIndex: [0], filterMode: 'none', start: zoom.start, end: zoom.end };
    const sliderZoom = {
      type: 'slider', xAxisIndex: [0], filterMode: 'none', start: zoom.start, end: zoom.end,
      bottom: 1, height: 12,
      left: pad.left, right: pad.right, borderColor: '#22303f', backgroundColor: '#0a121b',
      fillerColor: '#3b5a5033', handleStyle: { color: '#5b8a77' },
      textStyle: { color: '#6f8095', fontSize: 9 }, showDetail: false, brushSelect: false
    };

    dailyChart.setOption({
      animation: false, tooltip: tipStyle(dailyTip),
      grid: { left: pad.left, right: pad.right, top: 8, bottom: 18 },
      dataZoom: [insideZoom],
      xAxis: axis,
      yAxis: [valueAxis, indexAxis],
      series: [
        dailyLine('多头', aligned.bull, COLORS.bull),
        dailyLine('空头', aligned.bear, COLORS.bear),
        dailyLine('指数', aligned.index, COLORS.index, { yAxisIndex: 1, lineStyle: { width: 0.9, color: COLORS.index } })
      ]
    }, { notMerge: true });

    mainChart.setOption({
      animation: false, tooltip: tipStyle(mainTip),
      grid: { left: pad.left, right: pad.right, top: 8, bottom: 40 },
      dataZoom: [insideZoom, sliderZoom],
      xAxis: axis,
      yAxis: [valueAxis, indexAxis],
      series: [
        line('多头', points.map((point) => (isNum(point.bull) ? point.bull : null)), COLORS.bull),
        line('空头', points.map((point) => (isNum(point.bear) ? point.bear : null)), COLORS.bear),
        { name: '指数', type: 'line', yAxisIndex: 1, data: points.map((point) => (isNum(point.index) ? point.index : null)), showSymbol: false, connectNulls: false, lineStyle: { width: 0.9, color: COLORS.index }, itemStyle: { color: COLORS.index }, animation: false }
      ]
    }, { notMerge: true });

    subChart.setOption({
      animation: false, tooltip: tipStyle(subTip),
      grid: { left: pad.left, right: pad.right, top: 6, bottom: 18 },
      dataZoom: [insideZoom],
      xAxis: axis,
      yAxis: [valueAxis],
      series: [
        line('阻力', points.map((point) => (point.resistance > 0 ? point.resistance : null)), COLORS.resistance, { step: 'end' }),
        line('支撑', points.map((point) => (point.support > 0 ? point.support : null)), COLORS.support, { step: 'end' })
      ]
    }, { notMerge: true });
  }

  function resizeAll() {
    [dailyChart, mainChart, subChart].forEach((chart) => chart.resize());
  }

  function applyWindow(payload) {
    const intraday = (payload.intraday || []).filter((point) => point && typeof point.time === 'string');
    const daily = (payload.daily || []).filter((point) => point && typeof point.time === 'string');
    state.intraday = intraday;
    state.daily = daily;
    state.period = payload.period || '1d';
    const first = intraday[0];
    const last = intraday[intraday.length - 1];
    state.start = first ? first.time.slice(0, 10) : null;
    state.end = last ? last.time.slice(0, 10) : null;
    const days = new Set(intraday.map((point) => point.time.slice(0, 10))).size;
    document.getElementById('daily-meta').textContent = daily.length ? `${daily.length} 个交易日` : '—';
    document.getElementById('main-meta').textContent = intraday.length ? `${intraday.length} 点 · ${periodLabel(state.period)}` : '—';
    document.getElementById('sub-meta').textContent = intraday.length ? `${days} 个交易日` : '—';
    document.getElementById('main-title').textContent = `多空博弈 · 指数对照 · ${periodLabel(state.period)}`;
    document.getElementById('meta').textContent = intraday.length
      ? `${state.start} — ${state.end} · ${days} 个交易日 · ${clock.format(new Date())} 更新`
      : '暂无数据，等待下一次推送';
    paint();
    setTimeout(resizeAll, 0);
  }

  function sliceDays(points, days) {
    const list = (points || []).filter((point) => point && typeof point.time === 'string');
    const dates = [...new Set(list.map((point) => point.time.slice(0, 10)))];
    const keep = new Set(dates.slice(-days));
    return list.filter((point) => keep.has(point.time.slice(0, 10)));
  }

  async function loadLocal() {
    const slow = state.period !== '1d' && state.days > 30;
    document.getElementById('meta').textContent = slow ? '分钟数据聚合中，首次加载稍慢…' : '加载中…';
    const response = await fetch(`/api/v1/window?days=${state.days}&period=${state.period}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    applyWindow(await response.json());
  }

  function renderCloud() {
    if (!cloudPayload) return;
    const ranges = cloudPayload.ranges || {};
    const KEY = { '5m': 'm5', '15m': 'm15', '30m': 'm30', '60m': 'h60' };
    const pack = ranges[KEY[state.period]] || null;
    let intraday;
    let daily;
    let period;
    let note = '';
    if (pack && pack.points && pack.points.length) {
      intraday = sliceDays(pack.points, state.days);
      daily = sliceDays((ranges.daily || pack).points, state.days);
      period = pack.period || state.period;
      const covered = new Set(pack.points.map((point) => point.time.slice(0, 10))).size;
      if (covered < state.days) note = `云端该周期仅含近 ${covered} 个交易日`;
    } else {
      intraday = sliceDays(cloudPayload.points, state.days);
      daily = intraday;
      period = '5m';
      note = '云端暂无该周期数据';
    }
    applyWindow({ intraday, daily, period });
    if (note) document.getElementById('meta').textContent += ` · ${note}`;
  }

  async function loadCloud() {
    const response = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    cloudPayload = await response.json();
    renderCloud();
  }

  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      if (IS_LOCAL) await loadLocal();
      else await loadCloud();
    } catch (error) {
      document.getElementById('meta').textContent = `读取失败：${error.message}`;
    } finally {
      busy = false;
    }
  }

  function selectDays(days) {
    state.days = days;
    state.zoom = null;
    document.querySelectorAll('#range-chips button').forEach((button) => {
      button.classList.toggle('selected', Number(button.dataset.days) === days);
    });
    if (state.module !== 'battle') return;
    if (!IS_LOCAL && cloudPayload) renderCloud();
    else refresh();
  }

  function selectPeriod(period) {
    if (state.period === period && state.intraday.length) return;
    state.period = period;
    state.zoom = null;
    document.querySelectorAll('#period-chips button').forEach((button) => {
      button.classList.toggle('selected', button.dataset.period === period);
    });
    if (state.module !== 'battle') return;
    if (!IS_LOCAL && cloudPayload) renderCloud();
    else refresh();
  }

  function switchModule(key) {
    state.module = key;
    document.querySelectorAll('.nav-item').forEach((button) => {
      button.classList.toggle('active', button.dataset.module === key);
    });
    document.querySelectorAll('.subtab').forEach((button) => {
      button.classList.toggle('active', button.dataset.sub === 'all');
    });
    const info = MODULES[key] || { group: '', name: key };
    document.getElementById('crumb-module').textContent = info.group;
    document.getElementById('crumb-page').textContent = info.name;
    const battle = key === 'battle';
    document.getElementById('view-battle').hidden = !battle;
    document.getElementById('view-empty').hidden = battle;
    document.getElementById('empty-title').textContent = `${info.name} · 建设中`;
    if (battle) {
      setTimeout(resizeAll, 0);
      if (!state.intraday.length) refresh();
    }
  }

  document.querySelectorAll('.nav-item').forEach((button) => {
    button.addEventListener('click', () => switchModule(button.dataset.module));
  });
  document.querySelectorAll('.subtab').forEach((button) => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.subtab').forEach((item) => item.classList.toggle('active', item === button));
      if (button.dataset.sub === 'all') {
        document.getElementById('view-battle').hidden = false;
        document.getElementById('view-empty').hidden = true;
        setTimeout(resizeAll, 0);
        return;
      }
      document.getElementById('view-battle').hidden = true;
      document.getElementById('view-empty').hidden = false;
      document.getElementById('empty-title').textContent = `${button.textContent.trim()} · 建设中`;
    });
  });
  document.querySelectorAll('#range-chips button').forEach((button) => {
    button.addEventListener('click', () => selectDays(Number(button.dataset.days)));
  });
  document.querySelectorAll('#period-chips button').forEach((button) => {
    button.addEventListener('click', () => selectPeriod(button.dataset.period));
  });

  window.addEventListener('resize', resizeAll);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.setInterval(refresh, IS_LOCAL ? 60000 : 300000);
  refresh();
  }
</script>
</body>
</html>
