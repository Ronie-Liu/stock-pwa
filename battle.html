<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多空博弈 · 云端</title>
  <script src="https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0a0f16; color: #dfe8f2; font: 13px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; }
    .wrap { padding: 12px; }
    .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .head h1 { margin: 0; font-size: 15px; }
    .meta { color: #7d8fa4; font-size: 11px; }
    #chart { width: 100%; height: 62vh; min-height: 320px; }
    .legend { display: flex; gap: 14px; font-size: 11px; color: #8b9caf; margin: 4px 0 8px; }
    .legend i { display: inline-block; width: 12px; height: 2px; margin-right: 5px; vertical-align: middle; }
    .foot { color: #5b6c80; font-size: 10px; margin-top: 6px; }
    body.embed .head, body.embed .foot { display: none; }
    body.embed .wrap { padding: 6px 8px 0; }
    body.embed #chart { height: calc(100vh - 44px); min-height: 240px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>全市场多空博弈</h1><span class="meta" id="meta">加载中…</span></div>
  <div class="legend"><span><i style="background:#ef6b78"></i>多头</span><span><i style="background:#3fc39b"></i>空头</span><span><i style="background:#8d99a8;height:1px"></i>指数</span></div>
  <div id="chart"></div>
  <p class="foot">数据每 5 分钟由本地情报站推送；盘中为采集时点快照，仅供研究。</p>
</div>
<script>
  // 二选一：DATA_URL 填 OSS 的完整 JSON 地址；或 API_BASE 填自建后端根地址
  // 例如 https://你的bucket.oss-cn-hangzhou.aliyuncs.com/battle/today.json
  const DATA_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/today.json';
  const API_BASE = '';
  if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
  const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
  const fmt = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 });

  function render(payload) {
    const points = Array.isArray(payload.points) ? payload.points : [];
    document.getElementById('meta').textContent = points.length
      ? `${payload.date} · ${points[points.length - 1].time.slice(11)} · ${points.length} 点`
      : '暂无数据，等待下一次推送';
    chart.setOption({
      backgroundColor: 'transparent',
      animation: false,
      tooltip: { trigger: 'axis', confine: true },
      grid: [{ left: 46, right: 52, top: 24, height: '58%' }, { left: 46, right: 52, top: '76%', height: '12%' }],
      xAxis: [
        { type: 'category', data: points.map((p) => p.time.slice(11)), boundaryGap: false, axisLabel: { color: '#6f8095', fontSize: 10 } },
        { type: 'category', gridIndex: 1, data: points.map((p) => p.time.slice(11)), boundaryGap: false, axisLabel: { show: false } }
      ],
      yAxis: [
        { type: 'log', logBase: 10, min: 1, splitNumber: 3, axisLabel: { color: '#6f8095', fontSize: 10 }, splitLine: { lineStyle: { color: '#1c2632', type: 'dashed' } } },
        { type: 'value', position: 'right', scale: true, axisLabel: { color: '#6f8095', fontSize: 10 }, splitLine: { show: false } },
        { type: 'value', gridIndex: 1, min: 0, max: 1, splitNumber: 1, axisLabel: { show: false }, splitLine: { show: false } }
      ],
      series: [
        { name: '多头', type: 'line', data: points.map((p) => p.bull || null), lineStyle: { width: 1.6, color: '#ef6b78' }, itemStyle: { color: '#ef6b78' }, showSymbol: false },
        { name: '空头', type: 'line', data: points.map((p) => p.bear || null), lineStyle: { width: 1.6, color: '#3fc39b' }, itemStyle: { color: '#3fc39b' }, showSymbol: false },
        { name: '指数', type: 'line', yAxisIndex: 1, data: points.map((p) => p.index), lineStyle: { width: 0.9, color: '#8d99a8' }, itemStyle: { color: '#8d99a8' }, showSymbol: false },
        { name: '阻力', type: 'line', xAxisIndex: 1, yAxisIndex: 2, data: points.map((p) => p.resistance || null), step: 'end', lineStyle: { width: 1.2, color: '#e3a25c' }, itemStyle: { color: '#e3a25c' }, showSymbol: false },
        { name: '支撑', type: 'line', xAxisIndex: 1, yAxisIndex: 2, data: points.map((p) => p.support || null), step: 'end', lineStyle: { width: 1.2, color: '#6ba6f2' }, itemStyle: { color: '#6ba6f2' }, showSymbol: false }
      ]
    });
  }

  async function load() {
    try {
      const endpoint = DATA_URL || `${API_BASE}/api/battle`;
      const response = await fetch(endpoint, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      render(await response.json());
    } catch (error) {
      document.getElementById('meta').textContent = `读取失败：${error.message}`;
    }
  }

  window.addEventListener('resize', () => chart.resize());
  setInterval(load, 300000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
</script>
</body>
</html>
