name: 共振数据更新

on:
  schedule:
    # GitHub Actions cron 为 UTC（北京时间 = UTC+8）。只在工作日跑。
    # 盘中 8 个时点各跑一次「快照」（约 56 次请求，很轻）：
    #   10:00 10:30 11:00 11:30 13:30 14:00 14:30 15:00
    - cron: '0 2 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '0 7 * * 1-5'
    # 收盘后 15:45：用 5 分钟 K 线逐股精确复盘，覆盖盘中快照（约 5500 次请求，约 3 分钟）
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-resonance
  cancel-in-progress: false

jobs:
  update-resonance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collector
        run: python scripts/update_resonance.py

      - name: Commit and push if updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resonance_history.json data/resonance_data.js index.html
          if git diff --cached --quiet; then
            echo '无变化，跳过提交'
            exit 0
          fi
          git commit -m "共振数据自动更新 $(TZ=Asia/Shanghai date +'%F %H:%M')"
          git push
