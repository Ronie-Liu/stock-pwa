name: 股票定时监控

on:
  schedule:
    # 北京时间 8:00-20:00，每小时启动一个持续60分钟的长任务
    # 任务内部每1分钟检查一次，确保推送及时
    - cron: '0 0 * * *'   # 8:00 启动
    - cron: '0 1 * * *'   # 9:00
    - cron: '0 2 * * *'   # 10:00
    - cron: '0 3 * * *'   # 11:00
    - cron: '0 4 * * *'   # 12:00
    - cron: '0 5 * * *'   # 13:00
    - cron: '0 6 * * *'   # 14:00
    - cron: '0 7 * * *'   # 15:00
    - cron: '0 8 * * *'   # 16:00
    - cron: '0 9 * * *'   # 17:00
    - cron: '0 10 * * *'  # 18:00
    - cron: '0 11 * * *'  # 19:00
    - cron: '0 12 * * *'  # 20:00

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65  # 每小时job，留5分钟余量
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run continuous monitor (check every 1 min)
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          # 持续运行60分钟，每1分钟检查一次
          end_time=$(($(date +%s) + 3600))
          while [ $(date +%s) -lt $end_time ]; do
            python scripts/stock_monitor.py
            sleep 60
          done
