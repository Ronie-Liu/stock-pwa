name: 股票定时监控

on:
  schedule:
    # 全天每20分钟检查（UTC时间 = 北京时间-8）
    # 8:00-20:00 北京时间 (0:00-12:00 UTC)
    - cron: '0,20,40 0 * * *'   # 8:00-8:40
    - cron: '0,20,40 1 * * *'   # 9:00-9:40
    - cron: '0,20,40 2 * * *'   # 10:00-10:40
    - cron: '0,20,40 3 * * *'   # 11:00-11:40
    - cron: '0,20,40 4 * * *'   # 12:00-12:40
    - cron: '0,20,40 5 * * *'   # 13:00-13:40
    - cron: '0,20,40 6 * * *'   # 14:00-14:40
    - cron: '0,20,40 7 * * *'   # 15:00-15:40
    - cron: '0,20,40 8 * * *'   # 16:00-16:40
    - cron: '0,20,40 9 * * *'   # 17:00-17:40
    - cron: '0,20,40 10 * * *'  # 18:00-18:40
    - cron: '0,20,40 11 * * *'  # 19:00-19:40
    - cron: '0,20,40 12 * * *'  # 20:00-20:40

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run stock monitor
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/stock_monitor.py
