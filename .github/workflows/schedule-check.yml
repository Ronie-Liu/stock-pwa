name: 股票定时监控

on:
  schedule:
    # 北京时间 8:00-20:50，每10分钟检查一次
    - cron: '*/10 0 * * *'   # 8:00-8:50
    - cron: '*/10 1 * * *'   # 9:00-9:50
    - cron: '*/10 2 * * *'   # 10:00-10:50
    - cron: '*/10 3 * * *'   # 11:00-11:50
    - cron: '*/10 4 * * *'   # 12:00-12:50
    - cron: '*/10 5 * * *'   # 13:00-13:50
    - cron: '*/10 6 * * *'   # 14:00-14:50
    - cron: '*/10 7 * * *'   # 15:00-15:50
    - cron: '*/10 8 * * *'   # 16:00-16:50
    - cron: '*/10 9 * * *'   # 17:00-17:50
    - cron: '*/10 10 * * *'  # 18:00-18:50
    - cron: '*/10 11 * * *'  # 19:00-19:50
    - cron: '*/10 12 * * *'  # 20:00-20:50

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stock monitor
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python scripts/stock_monitor.py
