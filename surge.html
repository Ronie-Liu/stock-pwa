<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>异动拉升</title>
  <style>
    :root { color-scheme: dark; --up:#ef6b78; --dn:#3fc39b; --bg:#0a0f16; --card:#111b26; --line:#1d2a38; --text:#dfe8f2; --mute:#7d8fa4; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px 0; }
    .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    .head h1 { margin: 0; font-size: 15px; letter-spacing: .5px; }
    .meta { color: var(--mute); font-size: 11px; }
    .cond { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-bottom: 6px; }
    .cond span { background: #0f1a25; border: 1px solid var(--line); color: #9fb4c9; border-radius: 5px; padding: 2px 6px; font-size: 10px; white-space: nowrap; }
    .cond span.off { color: #5b6c80; border-style: dashed; }
    .bar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .seg { display: flex; flex: 1 1 auto; min-width: 0; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .seg::-webkit-scrollbar { display: none; }
    .seg button, .chip { background: #111b26; color: #93a6ba; border: 1px solid #22303f; border-radius: 6px; padding: 4px 9px; font: 11px/1.2 inherit; white-space: nowrap; }
    .seg button.on { background: #1d3a31; border-color: #3f6b58; color: #d6efe2; }
    .chip.on { background: #1d3350; border-color: #3f5f8b; color: #cfe2f8; }
    .chip.act { background: #3a1d2b; border-color: #6b3f52; color: #f2d6e1; }
    .stat { display: flex; gap: 10px; color: #5b6c80; font-size: 10px; margin-bottom: 5px; }
    .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
    .item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px 6px; margin-bottom: 6px; }
    .r1 { display: flex; align-items: baseline; gap: 6px; }
    .name { font-size: 14px; font-weight: 600; }
    .code { color: var(--mute); font-size: 10px; }
    .theme { color: #6f8aa5; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
    .chg { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .dn { color: var(--dn); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px 4px; margin-top: 5px; }
    .cell { background: #0d1721; border-radius: 5px; padding: 3px 5px; min-width: 0; }
    .cell i { display: block; color: #64798f; font-size: 9px; font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell b { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell b small { font-size: 9px; font-weight: 400; color: #6f8aa5; margin-left: 1px; }
    .tag { display: inline-block; font-size: 9px; padding: 0 4px; border-radius: 3px; border: 1px solid #6b3f52; color: #f2a6be; margin-left: 4px; vertical-align: middle; }
    .more { width: 100%; background: #111b26; color: #93a6ba; border: 1px solid #22303f; border-radius: 8px; padding: 9px; font: 12px inherit; margin: 2px 0 8px; }
    .foot { flex: 0 0 auto; color: #4d5d6f; font-size: 10px; padding: 4px 0 6px; text-align: center; }
    .empty { color: var(--mute); text-align: center; padding: 40px 0; font-size: 12px; }
    body.embed .head { display: flex; margin-bottom: 4px; }
    body.embed .head h1 { display: none; }
    body.embed .meta { font-size: 10px; }
    body.embed .foot { display: none; }
    body.embed .wrap { padding: 6px 8px 0; }
    .sheet { position: fixed; inset: 0; background: #0a0f16; display: none; flex-direction: column; z-index: 20; }
    .sheet.open { display: flex; }
    .sheet header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .sheet header b { font-size: 14px; flex: 1 1 auto; }
    .sheet header button { background: #111b26; border: 1px solid #22303f; color: #9fb4c9; border-radius: 6px; padding: 5px 12px; font: 12px inherit; }
    .sheet header button.ok { background: #1d3a31; border-color: #3f6b58; color: #d6efe2; }
    .fields { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px 20px; }
    .field { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #131f2a; }
    .field span { flex: 0 0 92px; font-size: 12px; color: #9fb4c9; }
    .field input { flex: 1 1 0; min-width: 0; background: #0d1721; border: 1px solid #22303f; color: var(--text); border-radius: 5px; padding: 6px 8px; font: 12px/1.2 inherit; }
    .field input:focus { outline: 1px solid #3f6b58; }
    .field em { color: #4d5d6f; font-style: normal; font-size: 10px; }
    .name { cursor: pointer; color: #cfe2f8; }
    .name:active { opacity: .6; }
    .name i { font-style: normal; color: #4d5d6f; font-size: 11px; margin-left: 2px; }
    .dbody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
    .dsec { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px 4px; margin-bottom: 10px; }
    .dsec h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: #9fb4c9; display: flex; justify-content: space-between; align-items: baseline; }
    .dsec h2 small { font-size: 10px; font-weight: 400; color: #64798f; }
    .dsec canvas { display: block; width: 100%; touch-action: pan-y; }
    .dchips { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 10px; color: #7d8fa4; padding: 0 0 5px; }
    .dchips b { font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>异动拉升</h1><span class="meta" id="meta">加载中…</span></div>
  <div class="cond" id="cond"></div>
  <div class="bar">
    <div class="seg" id="sort">
      <button type="button" data-k="main_gain" class="on">主段涨幅</button>
      <button type="button" data-k="main_vol_share">量占比</button>
      <button type="button" data-k="main_conc">集中度</button>
      <button type="button" data-k="pct_chg">涨幅</button>
      <button type="button" data-k="prev10">10日异</button>
    </div>
    <button type="button" class="chip" id="strat">A∧B∧E</button>
    <button type="button" class="chip" id="filterBtn">筛选</button>
  </div>
  <div class="stat"><span id="stat"></span></div>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
  <p class="foot">每 30 分钟一轮；14:00 前不含集中度/量比条件，14:00 后以当时累计成交量为基准</p>
</div>

<div class="sheet" id="sheet">
  <header>
    <b>筛选条件</b>
    <button type="button" id="resetBtn">重置</button>
    <button type="button" id="applyBtn" class="ok">完成</button>
  </header>
  <div class="fields" id="fields"></div>
</div>

<div class="sheet detail" id="detail">
  <header>
    <b id="dTitle">—</b>
    <button type="button" id="dClose">关闭</button>
  </header>
  <div class="dbody" id="dBody"></div>
</div>

<script>
  (function () {
    const IS_LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    const OSS = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/surge.json';
    const SRC = IS_LOCAL ? 'http://127.0.0.1:8765/api/v1/surge' : OSS;
    const DETAIL_BASE = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/surge_detail/';
    if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');

    const FIELDS = [
      ['main_gain', '主段涨幅%'], ['main_vol_share', '主段量占比%'], ['main_conc', '主段集中度'],
      ['tv_share', '合计量占比%'], ['sum_gain', '合计涨幅%'], ['sum_conc', '合计集中度'],
      ['main_minutes', '主段时长(分)'], ['sum_minutes', '合计时长(分)'], ['seg_cnt', '段数'],
      ['main_decay', '拉后衰减'], ['pct_chg', '涨幅%'], ['gap_open', '开盘涨幅%'],
      ['turnover', '换手%'], ['amplitude', '振幅%'], ['to5_mult', '换手倍数'],
      ['close_pos', '收盘位%'], ['ma120', 'MA120'], ['total_mv', '市值(亿)'],
      ['prev10', '10日异'], ['mc10', '10日段集'], ['r10', '10前涨%'], ['dd10', '10日回撤%'],
      ['dd_depth', '回撤深度'], ['hp10', '距10高%'], ['nowcmp', '现价比较'], ['hpdays', '高距天'],
      ['to10_ratio', '10换比'], ['d10max', '10大涨%'], ['amp10', '10日振%'], ['to10_sum', '10换和%'],
      ['rng70', '70涨幅%'], ['lu70', '70涨停'], ['is_margin', '两融']
    ];

    const TEXTS = [['name', '名称包含'], ['theme_seg', '主题/行业包含']];

    const state = { payload: null, key: 'main_gain', strat: false, filters: {}, show: 40 };
    const el = (id) => document.getElementById(id);
    const fmt = (v, d) => (typeof v === 'number' && isFinite(v) ? v.toFixed(d === undefined ? 2 : d) : '—');
    const sign = (v, d) => (typeof v === 'number' && isFinite(v) ? (v > 0 ? '+' : '') + v.toFixed(d === undefined ? 2 : d) : '—');
    const cls = (v) => (typeof v === 'number' && v > 0 ? 'up' : typeof v === 'number' && v < 0 ? 'dn' : '');
    const hm = (v) => (typeof v === 'number' ? String(Math.floor(v / 100)).padStart(2, '0') + ':' + String(v % 100).padStart(2, '0') : '—');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    try { state.filters = JSON.parse(localStorage.getItem('surge_filters') || '{}') || {}; } catch (e) { state.filters = {}; }
    try { state.key = localStorage.getItem('surge_sort') || 'main_gain'; } catch (e) {}

    function conditions(cond, concApplied) {
      if (!cond) return '';
      const list = [
        `主段涨幅 ≥ ${cond.main_gain}%`,
        `主段量占比 ≥ ${cond.main_vol_share}%`,
        `集中度 ≥ ${cond.main_conc}`,
        `市值 ≤ ${cond.total_mv}亿`,
        `前10日异 ≥ ${cond.prev10}`
      ];
      return list.map((t, i) => `<span class="${i === 2 && !concApplied ? 'off' : ''}">${esc(t)}${i === 2 && !concApplied ? '（14:00后）' : ''}</span>`).join('');
    }

    function pass(row) {
      for (const key of Object.keys(state.filters)) {
        const rule = state.filters[key];
        if (!rule) continue;
        if (typeof rule === 'string') {
          if (!String(row[key] == null ? '' : row[key]).toLowerCase().includes(rule.toLowerCase())) return false;
          continue;
        }
        const value = row[key];
        if (rule.min !== '' && rule.min != null) {
          if (typeof value !== 'number' || value < Number(rule.min)) return false;
        }
        if (rule.max !== '' && rule.max != null) {
          if (typeof value !== 'number' || value > Number(rule.max)) return false;
        }
      }
      return true;
    }

    function rows() {
      const all = (state.payload && state.payload.rows) || [];
      let list = all.filter(pass);
      if (state.strat) list = list.filter((r) => r.strategy && r.strategy.hit);
      const key = state.key;
      list = list.slice().sort((a, b) => {
        const x = a[key], y = b[key];
        if (typeof x !== 'number') return 1;
        if (typeof y !== 'number') return -1;
        return y - x;
      });
      return list;
    }

    function cell(label, value, extra, d) {
      return `<div class="cell"><i>${label}</i><b>${value}${extra ? `<small>${extra}</small>` : ''}</b></div>`;
    }

    function render() {
      const p = state.payload;
      if (!p) return;
      const list = rows();
      el('meta').textContent = `${p.cycle || ''} · 更新 ${(p.asof || '').slice(11, 19)}`;
      el('cond').innerHTML = conditions(p.conditions, p.conc_applied);
      const active = Object.values(state.filters).filter((r) => (typeof r === 'string' ? r !== '' : r && (r.min !== '' && r.min != null || r.max !== '' && r.max != null))).length;
      const bits = [`命中 ${list.length}${p.total > (p.rows || []).length ? '（共 ' + p.total + '）' : ''} 只`,
        `候选 ${p.universe || 0}`, `取到 ${p.fetched || 0}`];
      if (active) bits.push(`筛选 ${active} 项`);
      if (p.capped) bits.push('已截断');
      if (p.degraded) bits.push('历史不足·未筛10日异');
      el('stat').textContent = bits.join(' · ');
      el('filterBtn').classList.toggle('act', active > 0);
      el('filterBtn').textContent = active ? `筛选 ${active}` : '筛选';

      if (!list.length) {
        el('list').innerHTML = `<div class="empty">本轮无异动拉升个股</div>`;
        return;
      }
      const shown = list.slice(0, state.show);
      const html = shown.map((r) => `<div class="item">
          <div class="r1">
            <span class="name" data-code="${esc(r.code)}" data-name="${esc(r.name)}">${esc(r.name)}<i>›</i></span>
            <span class="code">${esc(r.code)}</span>
            ${r.strategy && r.strategy.hit ? '<span class="tag">策略</span>' : ''}
            <span class="theme">${esc(r.theme_seg)}</span>
            <span class="chg ${cls(r.pct_chg)}">${sign(r.pct_chg)}%</span>
          </div>
          <div class="grid">
            ${cell('主段涨幅', `${sign(r.main_gain)}%`, hm(r.main_start))}
            ${cell('主段量占比', `${fmt(r.main_vol_share, 1)}%`)}
            ${cell('集中度', fmt(r.main_conc, 1))}
            ${cell('10日异', r.prev10 == null ? '—' : r.prev10)}
            ${cell('合计涨幅', `${sign(r.sum_gain)}%`)}
            ${cell('合计集中度', fmt(r.sum_conc, 1))}
            ${cell('收盘位', `${fmt(r.close_pos, 0)}%`)}
            ${cell('市值', fmt(r.total_mv, 0), '亿')}
            ${cell('10前涨', `${sign(r.r10)}%`)}
            ${cell('10日回撤', `${fmt(r.dd10, 1)}%`)}
            ${cell('现价比较', sign(r.nowcmp))}
            ${cell('回撤深度', sign(r.dd_depth, 1))}
            ${cell('距10高', `${sign(r.hp10)}%`)}
            ${cell('70涨幅', `${fmt(r.rng70, 1)}%`)}
            ${cell('10日振', `${fmt(r.amp10, 1)}%`)}
            ${cell('10大涨', `${fmt(r.d10max, 1)}%`)}
            ${cell('10换比', fmt(r.to10_ratio, 2))}
            ${cell('10换和', `${fmt(r.to10_sum, 1)}%`)}
            ${cell('70涨停', r.lu70 == null ? '—' : r.lu70)}
            ${cell('高距天', r.hpdays == null ? '—' : r.hpdays)}
            ${cell('开盘涨幅', `${sign(r.gap_open)}%`)}
            ${cell('换手', `${fmt(r.turnover, 1)}%`)}
            ${cell('10日段集', fmt(r.mc10, 1))}
            ${cell('换手倍', fmt(r.to5_mult, 2))}
            ${cell('MA120', fmt(r.ma120, 2))}
            ${cell('两融', r.is_margin ? '是' : '否')}
          </div>
        </div>`).join('') + (list.length > shown.length
          ? `<button type="button" class="more" id="moreBtn">加载更多（剩余 ${list.length - shown.length}）</button>`
          : '');
      el('list').innerHTML = html;
      const more = el('moreBtn');
      if (more) more.addEventListener('click', () => { state.show += 40; render(); });
    }

    function fieldsHtml() {
      const head = TEXTS.map(([key, label]) => {
        const value = typeof state.filters[key] === 'string' ? state.filters[key] : '';
        return `<div class="field">
          <span>${label}</span>
          <input type="text" data-k="${key}" data-t="1" placeholder="关键字" value="${esc(value)}">
        </div>`;
      }).join('');
      return head + FIELDS.map(([key, label]) => {
        const rule = state.filters[key] || {};
        return `<div class="field">
          <span>${label}</span>
          <input type="number" inputmode="decimal" data-k="${key}" data-b="min" placeholder="最小" value="${rule.min == null ? '' : esc(rule.min)}">
          <em>~</em>
          <input type="number" inputmode="decimal" data-k="${key}" data-b="max" placeholder="最大" value="${rule.max == null ? '' : esc(rule.max)}">
        </div>`;
      }).join('');
    }

    // ---------- 个股详情：当日分时 + 近 20 日 K 线 ----------

    const UP = '#ef6b78', DN = '#3fc39b';
    const charts = { min: null, day: null };

    function canvasBox(canvas, height) {
      const width = Math.max(220, canvas.clientWidth || 320);
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.height = height + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      return { ctx: ctx, w: width, h: height };
    }

    function clock(v) {
      return String(v == null ? '' : v).padStart(4, '0').replace(/^(\d{2})(\d{2})$/, '$1:$2');
    }

    function drawIntraday(data, index) {
      const canvas = el('cMin');
      if (!canvas) return;
      const box = canvasBox(canvas, 196);
      const ctx = box.ctx, w = box.w, h = box.h;
      const ps = (data.intraday && data.intraday.p) || [];
      const vs = (data.intraday && data.intraday.v) || [];
      const avg = (data.intraday && data.intraday.a) || [];
      const times = (data.intraday && data.intraday.t) || [];
      if (ps.length < 2) {
        ctx.fillStyle = '#7d8fa4'; ctx.font = '11px sans-serif';
        ctx.fillText('暂无分时数据', 8, 24);
        return;
      }
      const base = data.prev_close || ps[0];
      const padR = 42, top = 6, priceH = h * 0.66, volTop = priceH + 14, volH = h - volTop - 13;
      const plotW = w - padR;
      let lo = Math.min.apply(null, ps.concat(avg, [base]));
      let hi = Math.max.apply(null, ps.concat(avg, [base]));
      const pad = (hi - lo) * 0.06 || 0.01;
      lo -= pad; hi += pad;
      const X = (i) => (i / (ps.length - 1)) * plotW;
      const Y = (v) => top + ((hi - v) / (hi - lo)) * (priceH - top);
      ctx.font = '9px sans-serif'; ctx.lineWidth = 1;
      for (let k = 0; k <= 4; k++) {
        const value = hi - ((hi - lo) * k) / 4;
        const y = Y(value);
        ctx.strokeStyle = '#1d2a38';
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plotW, y); ctx.stroke();
        ctx.fillStyle = value >= base ? UP : DN;
        ctx.textAlign = 'left';
        ctx.fillText(value.toFixed(2), plotW + 4, y + 3);
      }
      ctx.strokeStyle = '#4d5d6f'; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(0, Y(base)); ctx.lineTo(plotW, Y(base)); ctx.stroke();
      ctx.setLineDash([]);
      const vmax = Math.max.apply(null, vs.concat([1]));
      const bw = Math.max(1, (plotW / vs.length) * 0.7);
      for (let i = 0; i < vs.length; i++) {
        const vh = (vs[i] / vmax) * volH;
        ctx.fillStyle = i && ps[i] < ps[i - 1] ? 'rgba(63,195,155,.5)' : 'rgba(239,107,120,.5)';
        ctx.fillRect(X(i) - bw / 2, h - 13 - vh, bw, vh);
      }
      ctx.strokeStyle = '#cfe2f8'; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ps.forEach((p, i) => (i ? ctx.lineTo(X(i), Y(p)) : ctx.moveTo(X(i), Y(p))));
      ctx.stroke();
      if (avg.length === ps.length) {
        ctx.strokeStyle = '#f0b45a'; ctx.lineWidth = 1;
        ctx.beginPath();
        avg.forEach((p, i) => (i ? ctx.lineTo(X(i), Y(p)) : ctx.moveTo(X(i), Y(p))));
        ctx.stroke();
      }
      ctx.fillStyle = '#64798f'; ctx.font = '9px sans-serif';
      [0, Math.floor((times.length - 1) / 2), times.length - 1].forEach((i, k) => {
        if (i < 0 || !times[i]) return;
        ctx.textAlign = k === 0 ? 'left' : k === 2 ? 'right' : 'center';
        ctx.fillText(clock(times[i]), k === 0 ? 0 : k === 2 ? plotW : X(i), h - 2);
      });
      ctx.textAlign = 'left';
      charts.min = {
        index: index,
        indexAt: (x) => Math.max(0, Math.min(ps.length - 1, Math.round((x / plotW) * (ps.length - 1))))
      };
      if (index == null || !times[index]) return;
      const cx = X(index), py = Y(ps[index]);
      ctx.strokeStyle = '#8fa8c0'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, h - 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(plotW, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#22303f'; ctx.fillRect(plotW, py - 7, padR, 14);
      ctx.fillStyle = '#dfe8f2'; ctx.font = '9px sans-serif';
      ctx.fillText(ps[index].toFixed(2), plotW + 4, py + 3);
      const pctv = base ? (ps[index] / base - 1) * 100 : 0;
      const text = `${clock(times[index])} ${ps[index].toFixed(2)} ${sign(pctv)}% 均${(avg[index] || ps[index]).toFixed(2)}`;
      ctx.font = '10px sans-serif';
      const tw = ctx.measureText(text).width + 10;
      const tx = Math.max(0, Math.min(cx + 8, plotW - tw));
      ctx.fillStyle = 'rgba(10,15,22,.9)'; ctx.fillRect(tx, top + 1, tw, 16);
      ctx.fillStyle = '#cfe2f8'; ctx.fillText(text, tx + 5, top + 12);
    }

    function drawDaily(data, index) {
      const canvas = el('cDay');
      if (!canvas) return;
      const box = canvasBox(canvas, 214);
      const ctx = box.ctx, w = box.w, h = box.h;
      const d = data.daily || {};
      const n = (d.c || []).length;
      if (!n) {
        ctx.fillStyle = '#7d8fa4'; ctx.font = '11px sans-serif';
        ctx.fillText('暂无 K 线数据', 8, 24);
        return;
      }
      const padR = 42, top = 6, priceH = h * 0.64, volTop = priceH + 16, volH = h - volTop - 13;
      const plotW = w - padR;
      let lo = Math.min.apply(null, d.l), hi = Math.max.apply(null, d.h);
      const pad = (hi - lo) * 0.07 || 0.01;
      lo -= pad; hi += pad;
      const slot = plotW / n;
      const Y = (v) => top + ((hi - v) / (hi - lo)) * (priceH - top);
      ctx.font = '9px sans-serif'; ctx.lineWidth = 1;
      for (let k = 0; k <= 3; k++) {
        const value = hi - ((hi - lo) * k) / 3;
        const y = Y(value);
        ctx.strokeStyle = '#1d2a38';
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(plotW, y); ctx.stroke();
        ctx.fillStyle = '#64798f';
        ctx.fillText(value.toFixed(2), plotW + 4, y + 3);
      }
      const tos = d.to || [];
      const valid = tos.filter((x) => typeof x === 'number' && isFinite(x));
      const tmax = Math.max.apply(null, valid.concat([0.01]));
      const bw = Math.max(1.4, Math.min(9, slot * 0.62));
      for (let i = 0; i < n; i++) {
        const o = d.o[i], c = d.c[i], hh = d.h[i], ll = d.l[i];
        const color = c >= o ? UP : DN;
        const cx = slot * (i + 0.5);
        ctx.strokeStyle = color;
        ctx.beginPath(); ctx.moveTo(cx, Y(hh)); ctx.lineTo(cx, Y(ll)); ctx.stroke();
        const yO = Y(o), yC = Y(c);
        ctx.fillStyle = color;
        ctx.fillRect(cx - bw / 2, Math.min(yO, yC), bw, Math.max(1.2, Math.abs(yC - yO)));
        if (typeof tos[i] === 'number') {
          const th = (tos[i] / tmax) * volH;
          ctx.globalAlpha = 0.55;
          ctx.fillRect(cx - bw / 2, h - 13 - th, bw, th);
          ctx.globalAlpha = 1;
        }
      }
      ctx.fillStyle = '#64798f';
      ctx.textAlign = 'left';
      ctx.fillText('换手 ' + tmax.toFixed(1) + '%', plotW + 4, volTop + 8);
      [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
        if (!d.d[i]) return;
        ctx.textAlign = k === 0 ? 'left' : k === 2 ? 'right' : 'center';
        ctx.fillText(String(d.d[i]).slice(5), k === 0 ? 0 : k === 2 ? plotW : slot * (i + 0.5), h - 2);
      });
      ctx.textAlign = 'left';
      charts.day = {
        index: index,
        indexAt: (x) => Math.max(0, Math.min(n - 1, Math.floor(x / slot)))
      };
      if (index == null || !d.d[index]) return;
      const cx = slot * (index + 0.5), py = Y(d.c[index]);
      ctx.strokeStyle = '#8fa8c0'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, h - 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(plotW, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#22303f'; ctx.fillRect(plotW, py - 7, padR, 14);
      ctx.fillStyle = '#dfe8f2'; ctx.font = '9px sans-serif';
      ctx.fillText(d.c[index].toFixed(2), plotW + 4, py + 3);
      const prevC = index ? d.c[index - 1] : d.c[index];
      const pctv = prevC ? (d.c[index] / prevC - 1) * 100 : 0;
      const to = typeof tos[index] === 'number' ? ' 换' + tos[index].toFixed(1) + '%' : '';
      const text = `${String(d.d[index]).slice(5)} 开${d.o[index]} 高${d.h[index]} 低${d.l[index]} 收${d.c[index]} ${sign(pctv)}%${to}`;
      ctx.font = '9px sans-serif';
      const tw = ctx.measureText(text).width + 10;
      const tx = Math.max(0, Math.min(cx + 8, plotW - tw));
      ctx.fillStyle = 'rgba(10,15,22,.9)'; ctx.fillRect(tx, top + 1, tw, 15);
      ctx.fillStyle = '#cfe2f8'; ctx.fillText(text, tx + 5, top + 11.5);
    }

    function paintDetail() {
      const data = state.detail;
      if (!data) return;
      drawIntraday(data, charts.min && charts.min.index);
      drawDaily(data, charts.day && charts.day.index);
    }

    function bindCrosshair(id, kind) {
      const canvas = el(id);
      if (!canvas) return;
      let active = false;
      const apply = (event) => {
        const chart = charts[kind];
        if (!chart) return;
        const rect = canvas.getBoundingClientRect();
        chart.index = chart.indexAt(event.clientX - rect.left);
        paintDetail();
      };
      canvas.addEventListener('pointerdown', (event) => { active = true; apply(event); });
      canvas.addEventListener('pointermove', (event) => {
        if (active || event.pointerType === 'mouse') apply(event);
      });
      canvas.addEventListener('pointerup', () => { active = false; });
      canvas.addEventListener('pointercancel', () => { active = false; });
    }

    async function openDetail(code, name) {
      state.detail = null;
      charts.min = null;
      charts.day = null;
      el('dTitle').textContent = `${name} ${code}`;
      el('dBody').innerHTML = '<div class="empty">加载中…</div>';
      el('detail').classList.add('open');
      try {
        const response = await fetch(DETAIL_BASE + code + '.json?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!el('detail').classList.contains('open')) return;
        state.detail = data;
        const ps = (data.intraday && data.intraday.p) || [];
        const last = ps.length ? ps[ps.length - 1] : null;
        const pct = last && data.prev_close ? (last / data.prev_close - 1) * 100 : null;
        el('dTitle').textContent = `${data.name || name} ${code} · ${data.day} 更新 ${String(data.updated || '').slice(11, 19)}`;
        const snap = data.snap || {};
        const rel = (v) => (typeof v === 'number' && data.prev_close ? (v / data.prev_close - 1) * 100 : null);
        const pchip = (label, v) => {
          const p = rel(v);
          return `<span>${label} <b class="${cls(p)}">${p == null ? '—' : sign(p) + '%'}</b></span>`;
        };
        const vchip = (label, v) => `<span>${label} <b>${typeof v === 'number' ? v.toFixed(2) + '%' : '—'}</b></span>`;
        el('dBody').innerHTML = `
          <div class="dsec">
            <h2>当日分时<small>${data.day} 更新 ${String(data.updated || '').slice(11, 19)}</small></h2>
            <div class="dchips">${pchip('开', snap.open)}${pchip('低', snap.low)}${pchip('高', snap.high)}${pchip('现', last)}${vchip('换', snap.turnover)}${vchip('昨换', snap.prev_turnover)}</div>
            <canvas id="cMin"></canvas>
          </div>
          <div class="dsec">
            <h2>近 20 日 K 线<small>副图：换手率</small></h2>
            <canvas id="cDay"></canvas>
          </div>`;
        paintDetail();
        bindCrosshair('cMin', 'min');
        bindCrosshair('cDay', 'day');
      } catch (err) {
        el('dBody').innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
      }
    }

    el('list').addEventListener('click', (event) => {
      const node = event.target.closest('.name[data-code]');
      if (node) openDetail(node.dataset.code, node.dataset.name);
    });
    el('dClose').addEventListener('click', () => {
      el('detail').classList.remove('open');
      state.detail = null;
      charts.min = null;
      charts.day = null;
    });
    window.addEventListener('resize', () => { if (state.detail) paintDetail(); });

    el('sort').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      state.key = button.dataset.k;
      state.show = 40;
      try { localStorage.setItem('surge_sort', state.key); } catch (e) {}
      el('sort').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === button));
      render();
    });
    el('strat').addEventListener('click', () => {
      state.strat = !state.strat;
      el('strat').classList.toggle('on', state.strat);
      state.show = 40;
      render();
    });
    el('filterBtn').addEventListener('click', () => {
      el('fields').innerHTML = fieldsHtml();
      el('sheet').classList.add('open');
    });
    el('applyBtn').addEventListener('click', () => {
      const next = {};
      el('fields').querySelectorAll('input').forEach((input) => {
        const key = input.dataset.k;
        const value = input.value.trim();
        if (value === '') return;
        if (input.dataset.t === '1') {
          next[key] = value;
          return;
        }
        next[key] = next[key] || { min: '', max: '' };
        next[key][input.dataset.b] = value;
      });
      state.filters = next;
      state.show = 40;
      try { localStorage.setItem('surge_filters', JSON.stringify(next)); } catch (e) {}
      el('sheet').classList.remove('open');
      render();
    });
    el('resetBtn').addEventListener('click', () => {
      state.filters = {};
      try { localStorage.removeItem('surge_filters'); } catch (e) {}
      el('fields').innerHTML = fieldsHtml();
      render();
    });

    async function load() {
      try {
        const response = await fetch(SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        state.payload = await response.json();
        render();
      } catch (err) {
        el('meta').textContent = '数据加载失败：' + err.message;
        if (!state.payload) el('list').innerHTML = '<div class="empty">暂无数据，等待本轮生成</div>';
      }
    }

    el('sort').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.k === state.key));
    load();
    setInterval(load, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  })();
</script>
</body>
</html>
