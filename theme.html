<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f16">
  <title>主题多空热力</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: #0a0f16; color: #dfe8f2; font: 12px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { padding: 8px 8px calc(16px + env(safe-area-inset-bottom)); }
    body.embed { padding-top: 2px; }
    body.embed .nav { display: none; }
    .nav { display: flex; gap: 4px; padding: 2px; margin-bottom: 8px; border: 1px solid #1b262f; border-radius: 8px; background: #0d151e; }
    .nav a { flex: 1 1 0; padding: 6px 0; border-radius: 6px; color: #8b9caf; text-align: center; text-decoration: none; font-size: 12px; }
    .nav a.active { background: #17242f; color: #d6e8f5; }
    .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .title { font-size: 15px; font-weight: 600; }
    .title small { margin-left: 4px; color: #5b6c80; font-size: 10px; font-weight: 400; }
    .meta { margin-left: auto; color: #5b6c80; font-size: 10px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 3px; color: #6f8095; font-size: 9px; }
    .legend i { width: 12px; height: 9px; border-radius: 2px; }
    .heat-wrap { overflow-x: auto; overflow-y: hidden; border: 1px solid #16202c; border-radius: 8px; background: #0b131c; -webkit-overflow-scrolling: touch; }
    #heat { height: 380px; }
    .hint { margin: 6px 2px 10px; color: #55677c; font-size: 10px; }
    .block-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 6px; color: #9db3c8; font-size: 11px; }
    .block-head span:last-child { color: #55677c; font-size: 10px; }
    .rank { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid #16202c; border-radius: 6px; background: #0b131c; }
    .row .name { flex: 1 1 auto; min-width: 0; color: #cfdcea; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .bar { flex: 0 0 46px; height: 6px; border-radius: 3px; background: #17222e; overflow: hidden; position: relative; }
    .row .bar i { position: absolute; top: 0; bottom: 0; }
    .row .val { flex: 0 0 58px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
    .row .sub { flex: 0 0 74px; text-align: right; color: #6f8095; font-size: 10px; font-variant-numeric: tabular-nums; }
    .foot { margin: 12px 2px 0; color: #42536a; font-size: 10px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="nav">
  <a href="./index.html">全市场</a>
  <a href="./theme.html" class="active">主题热力</a>
</div>
<div class="head">
  <div class="title">主题多空热力<small>5 分钟 · 当日</small></div>
  <div class="meta" id="meta">加载中…</div>
</div>
<div class="legend" id="legend"></div>
<div class="heat-wrap" id="heat-wrap"><div id="heat"></div></div>
<div class="hint" id="hint">09:30 为上一交易日收盘基线，开盘后每 5 分钟追加。</div>
<div class="block-head"><span>最新净强度</span><span id="rank-meta">—</span></div>
<div class="rank" id="rank"></div>
<p class="foot">净强度 =（多头 − 空头）/ 样本数；多头=追高+抄底，空头=离场+恐慌。数据为采集时点快照，仅供研究。</p>
<script>
  if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
</script>
<script>
  (function boot() {
    const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    const script = document.createElement('script');
    script.src = local ? '/echarts.min.js' : 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/echarts.min.js';
    script.onload = () => main();
    script.onerror = () => { document.getElementById('meta').textContent = '图表组件加载失败'; };
    document.head.appendChild(script);
  })();
</script>
<script>
  function main() {
    const DATA_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/theme5m.json';
    const SCALE = [
      ['≤-10', '#155f42'], ['-10~-6', '#1f7a55'], ['-6~-3', '#2c9469'], ['-3~0', '#274a3f'],
      ['0', '#141d27'], ['0~3', '#4a2b33'], ['3~6', '#93404b'], ['6~10', '#c04a57'], ['≥10', '#f06372']
    ];
    const num = (value) => (typeof value === 'number' && Number.isFinite(value) ? value : null);
    function color(value) {
      if (num(value) === null) return '#101822';
      if (value <= -10) return '#155f42';
      if (value <= -6) return '#1f7a55';
      if (value <= -3) return '#2c9469';
      if (value < 0) return '#274a3f';
      if (value === 0) return '#141d27';
      if (value < 3) return '#4a2b33';
      if (value < 6) return '#93404b';
      if (value < 10) return '#c04a57';
      return '#f06372';
    }
    document.getElementById('legend').innerHTML = SCALE
      .map(([label, tint]) => `<span><i style="background:${tint}"></i>${label}</span>`).join('');

    const chart = echarts.init(document.getElementById('heat'), null, { renderer: 'canvas' });
    let state = { payload: null, rendered: '' };

    function render(payload) {
      const times = payload.times || [];
      const rows = payload.rows || [];
      const wrap = document.getElementById('heat-wrap');
      const host = document.getElementById('heat');
      const left = 88;
      const cell = Math.max(14, Math.min(22, (window.innerWidth - left - 24) / Math.max(12, times.length)));
      const width = left + times.length * cell + 14;
      host.style.width = `${width}px`;
      host.style.height = `${Math.max(220, rows.length * 24 + 40)}px`;
      chart.resize();
      const cells = [];
      rows.forEach((row, y) => {
        const map = new Map(row.points.map((point) => [point.time, point]));
        times.forEach((time, x) => {
          const point = map.get(time);
          if (!point) return;
          const strong = Math.abs(point.ratio) >= 10;
          cells.push({
            value: [x, y, point.ratio, point],
            itemStyle: {
              color: color(point.ratio),
              borderColor: strong ? '#e8f0f8' : '#0a0f16',
              borderWidth: strong ? 1 : 1
            }
          });
        });
      });
      chart.setOption({
        animation: false,
        grid: { left, right: 14, top: 8, bottom: 20 },
        tooltip: {
          backgroundColor: '#0b131c', borderColor: '#22303f', borderWidth: 1,
          textStyle: { color: '#dfe8f2', fontSize: 11 },
          formatter: (params) => {
            const point = params.value[3];
            const row = rows[params.value[1]];
            const ratio = point.ratio > 0 ? `+${point.ratio}%` : `${point.ratio}%`;
            return `<b>${row.name}</b><br>${point.time}${point.seed ? '（昨收）' : ''}`
              + `<br>净强度 ${ratio}`
              + `<br>多头 ${point.bull} · 空头 ${point.bear} · 样本 ${point.total}`
              + (num(point.index) === null ? '' : `<br>等权指数 ${point.index > 0 ? '+' : ''}${point.index}%`);
          }
        },
        xAxis: {
          type: 'category', data: times, boundaryGap: true,
          axisLine: { lineStyle: { color: '#1b262f' } }, axisTick: { show: false },
          axisLabel: { color: '#6f8095', fontSize: 8, interval: (index) => index === 0 || index % 6 === 0 },
          splitLine: { show: true, interval: (index) => index > 0 && index % 6 === 0, lineStyle: { color: '#1c2a38' } }
        },
        yAxis: {
          type: 'category', data: rows.map((row) => row.name), inverse: true,
          axisLine: { show: false }, axisTick: { show: false },
          axisLabel: { color: '#9fb0c2', fontSize: 9, width: left - 10, overflow: 'truncate' }
        },
        series: [{ type: 'heatmap', data: cells, animation: false,
          itemStyle: { borderColor: '#0a0f16', borderWidth: 1 },
          emphasis: { itemStyle: { borderColor: '#dfe8f2', borderWidth: 1.4 } } }]
      });
      requestAnimationFrame(() => { wrap.scrollLeft = wrap.scrollWidth; });
      renderRank(payload);
    }

    function renderRank(payload) {
      const rows = (payload.rows || []).slice().sort((a, b) => {
        const av = a.latest ? a.latest.ratio : 0;
        const bv = b.latest ? b.latest.ratio : 0;
        return bv - av;
      });
      const peak = Math.max(10, ...rows.map((row) => (row.latest ? Math.abs(row.latest.ratio) : 0)));
      document.getElementById('rank-meta').textContent = payload.times.length > 1
        ? `${payload.times[payload.times.length - 1]} 更新` : '等待开盘后追加';
      document.getElementById('rank').innerHTML = rows.map((row) => {
        const point = row.latest || {};
        const ratio = num(point.ratio) === null ? 0 : point.ratio;
        const width = Math.min(100, Math.abs(ratio) / peak * 100);
        const sign = ratio >= 0 ? 1 : -1;
        const bar = `<i style="width:${width}%;${sign > 0 ? `left:50%` : `right:50%`};background:${ratio >= 0 ? '#d8525f' : '#2f9c7a'}"></i>`;
        return `<div class="row"><span class="name">${row.name}</span>`
          + `<span class="bar"><i style="width:1px;left:50%;top:-2px;bottom:-2px;background:#2b3947"></i>${bar}</span>`
          + `<span class="val" style="color:${ratio >= 0 ? '#ef8a94' : '#5fc6a4'}">${ratio > 0 ? '+' : ''}${ratio.toFixed(1)}%</span>`
          + `<span class="sub">${point.bull || 0}/${point.bear || 0} · ${num(point.index) === null ? '—' : `${point.index > 0 ? '+' : ''}${point.index}%`}</span></div>`;
      }).join('');
    }

    function normalize(board) {
      const rows = (board.rows || []).map((row) => {
        const points = (row.points || []).map((point) => {
          const time = point.time;
          return Object.assign({}, point, { time: time.length > 10 ? time.slice(11, 16) : time });
        });
        return Object.assign({}, row, { points, latest: points[points.length - 1] || null });
      });
      const times = [];
      rows.forEach((row) => row.points.forEach((point) => {
        if (times.indexOf(point.time) < 0) times.push(point.time);
      }));
      return Object.assign({}, board, { rows, times: times.sort() });
    }

    async function fetchData() {
      try {
        const response = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } catch (error) {
        const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
        if (!local) throw error;
        const response = await fetch('/api/v1/rotation/live?level=theme&bucket=5m', { cache: 'no-store' });
        if (!response.ok) throw error;
        return normalize(await response.json());
      }
    }

    async function load() {
      try {
        const payload = await fetchData();
        if (!payload || !payload.rows || !payload.rows.length) {
          document.getElementById('meta').textContent = '暂无数据';
          return;
        }
        state.payload = payload;
        document.getElementById('meta').textContent = `${payload.date} · ${payload.generated_at.slice(11, 16)}`;
        document.getElementById('hint').textContent = payload.times.length > 1
          ? `已采集 ${payload.times.length} 个时点（09:30 为上一交易日收盘基线）`
          : '09:30 为上一交易日收盘基线，开盘后每 5 分钟追加。';
        render(payload);
      } catch (error) {
        document.getElementById('meta').textContent = `读取失败：${error.message}`;
      }
    }

    load();
    setInterval(load, 60000);
    window.addEventListener('resize', () => { if (state.payload) render(state.payload); });
  }
</script>
</body>
</html>
