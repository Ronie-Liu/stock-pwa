<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股票监控">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="A股自选股/持仓股实时价格监控与推送提醒">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <title>自选股价格监控</title>
  <link rel="stylesheet" href="/css/style.css?v=20260613a">
</head>
<body>
  <div id="app">
    <!-- Tab 1: 自选股监控 -->
    <div class="page active" id="page-watchlist"></div>

    <!-- Tab 2: 持仓股管理 -->
    <div class="page" id="page-holdings"></div>

    <!-- Tab 3: 大盘 -->
    <div class="page" id="page-market"></div>

    <!-- Tab 4: 上传文件 -->
    <div class="page" id="page-upload"></div>

    <!-- Tab 5: 设置 -->
    <div class="page" id="page-settings"></div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="watchlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>自选股</span>
      </button>
      <button class="nav-item" data-tab="holdings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
        </svg>
        <span>持仓股</span>
      </button>
      <button class="nav-item" data-tab="market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span>大盘</span>
      </button>
      <button class="nav-item" data-tab="upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>上传文件</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <!-- JS 脚本（按依赖顺序加载） -->
  <script src="/js/utils.js?v=20260613a"></script>
  <script src="/js/db.js?v=20260613a"></script>
  <script src="/js/api.js?v=20260613a"></script>
  <script src="/js/analysis.js?v=20260613a"></script>
  <script src="/js/ui.js?v=20260613a"></script>
  <script src="/js/charts.js?v=20260613a"></script>
  <script src="/js/csv.js?v=20260613a"></script>
  <script src="/js/market.js?v=20260613a"></script>
  <script src="/js/app.js?v=20260613a"></script>
</body>
</html>
