<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多空博弈</title>
  <style>
    :root { color-scheme: dark; --bull:#ef6b78; --bear:#3fc39b; --index:#8d99a8; --resistance:#e3a25c; --support:#6ba6f2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: #0a0f16; color: #dfe8f2; font: 13px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    .wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px 4px; }
    .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .head h1 { margin: 0; font-size: 15px; }
    .meta { color: #7d8fa4; font-size: 11px; }
    .toolbar { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    body.local .toolbar { display: flex; }
    .toolbar button, .toolbar input { background: #111b26; color: #b9c8d8; border: 1px solid #22303f; border-radius: 6px; padding: 3px 9px; font-size: 11px; font-family: inherit; }
    .toolbar button { cursor: pointer; }
    .toolbar button.selected { background: #1d3a31; border-color: #3f6b58; color: #d6efe2; }
    .toolbar input { padding: 2px 6px; }
    .sep { width: 1px; height: 16px; background: #22303f; }
    .block { flex: 0 0 auto; display: flex; flex-direction: column; min-height: 0; }
    .block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 2px 0; }
    .block-title { color: #9db3c8; font-size: 11px; letter-spacing: .3px; }
    .block-meta { color: #5b6c80; font-size: 10px; }
    .recent-wrap { flex: 0 0 26%; min-height: 96px; display: flex; flex-direction: column; padding-bottom: 2px; border-bottom: 1px solid #17212d; margin-bottom: 2px; }
    #recent-chart { flex: 1 1 auto; min-height: 0; }
    #chart { flex: 1 1 auto; min-height: 0; }
    .nextday-wrap { flex: 0 0 24%; min-height: 104px; display: flex; flex-direction: column; border-top: 1px solid #17212d; margin-top: 6px; padding-top: 3px; }
    #nextday-chart { flex: 1 1 auto; min-height: 0; }
    .legend { display: flex; gap: 12px; font-size: 11px; color: #8b9caf; margin: 4px 0 2px; }
    .legend i { display: inline-block; width: 12px; height: 2px; margin-right: 5px; vertical-align: middle; }
    .nd-legend { display: flex; gap: 9px; font-size: 9px; color: #8b9caf; margin: 3px 0 1px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .nd-legend::-webkit-scrollbar { display: none; }
    .nd-legend span { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .nd-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
    .nd-legend i.line { height: 2px; border-radius: 1px; width: 11px; }
    .foot { color: #5b6c80; font-size: 10px; margin: 2px 0 0; }
    .tip { min-width: 128px; }
    .tip-title { color: #9fb4c9; font-size: 11px; margin-bottom: 3px; }
    .tip-row { display: flex; justify-content: space-between; gap: 18px; font-size: 11px; line-height: 1.55; }
    .tip-row span { color: #8b9caf; }
    .tip-row b { color: #dfe8f2; font-weight: 500; }
    body.embed .head, body.embed .foot, body.embed .toolbar { display: none; }
    body.embed .wrap { padding: 4px 6px 2px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>全市场多空博弈</h1><span class="meta" id="meta">加载中…</span></div>
  <div class="toolbar" id="toolbar">
    <span id="period-group">
      <button type="button" data-period="5m">5m</button>
      <button type="button" data-period="30m">30m</button>
      <button type="button" data-period="60m">60m</button>
      <button type="button" data-period="1d" class="selected">日线</button>
    </span>
    <span class="sep"></span>
    <span id="axis-group">
      <button type="button" data-axis="log" class="selected">对数</button>
      <button type="button" data-axis="linear">线性</button>
    </span>
    <span class="sep"></span>
    <input type="date" id="start-date" value="2026-01-01" aria-label="开始日期">
    <span style="color:#5b6c80">–</span>
    <input type="date" id="end-date" aria-label="结束日期">
  </div>
  <div class="recent-wrap">
    <div class="block-head"><span class="block-title">近 5 个交易日 · 60 分钟多空趋势</span><span class="block-meta" id="recent-meta">—</span></div>
    <div id="recent-chart"></div>
  </div>
  <div class="block-head"><span class="block-title" id="main-title">今日 5 分钟 · 多空与阻力支撑</span><span class="block-meta" id="points-count">—</span></div>
  <div class="legend"><span><i style="background:#ef6b78"></i>多头</span><span><i style="background:#3fc39b"></i>空头</span><span><i style="background:#8d99a8;height:1px"></i>指数</span><span><i style="background:#e3a25c"></i>阻力</span><span><i style="background:#6ba6f2"></i>支撑</span></div>
  <div id="chart"></div>
  <div class="nextday-wrap">
    <div class="block-head"><span class="block-title">昨日 - 今日表现 · 5分钟中位数</span><span class="block-meta" id="nextday-meta">—</span></div>
    <div class="nd-legend" id="nd-legend">
      <span><i class="line" style="background:#ef6b78"></i>强势组</span>
      <span><i class="line" style="background:#3fc39b"></i>弱势组</span>
      <span><i style="background:#ff4d4f"></i>全面反弹</span>
      <span><i style="background:#ff922b"></i>强势延续</span>
      <span><i style="background:#ffd43b"></i>弱势修复</span>
      <span><i style="background:#b06aff"></i>两极分化</span>
      <span><i style="background:#8d99ae"></i>窄幅整理</span>
      <span><i style="background:#4dabf7"></i>高低切换</span>
      <span><i style="background:#69db7c"></i>温和退潮</span>
      <span><i style="background:#20c997"></i>强势补跌</span>
      <span><i style="background:#087f5b"></i>全面走弱</span>
    </div>
    <div id="nextday-chart"></div>
  </div>
  <p class="foot">数据每 5 分钟更新；盘中为采集时点快照，仅供研究。</p>
</div>
<script>
  (function boot() {
    const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    const script = document.createElement('script');
    script.src = local ? '/echarts.min.js' : 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/echarts.min.js';
    script.onload = () => main();
    script.onerror = () => { document.getElementById('meta').textContent = '图表组件加载失败，请检查网络'; };
    document.head.appendChild(script);
  })();
</script>
<script>
  function main() {
  if (!window.echarts) { document.getElementById('meta').textContent = '图表组件不可用'; return; }
  const DATA_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/today.json';
  const NEXTDAY_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/nextday.json';
  const NEXTDAY5M_URL = 'https://yunfei-station-2026.oss-cn-shanghai.aliyuncs.com/battle/nextday5m.json';
  const IS_LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
  if (IS_LOCAL) document.body.classList.add('local');

  const COLORS = { bull: '#ef6b78', bear: '#3fc39b', index: '#8d99a8', resistance: '#e3a25c', support: '#6ba6f2' };
  const fmt = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 2 });
  const compact = new Intl.NumberFormat('zh-CN', { notation: 'compact', maximumFractionDigits: 1 });
  const clock = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false });
  const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
  const recentChart = echarts.init(document.getElementById('recent-chart'), null, { renderer: 'canvas' });
  const nextdayChart = echarts.init(document.getElementById('nextday-chart'), null, { renderer: 'canvas' });
  chart.group = 'battle';
  nextdayChart.group = 'battle';
  echarts.connect('battle');
  const state = { period: '1d', axis: 'log', points: [], recent: [], nextday: [], nextdayMin: [], nextdayDaily: {}, nextdayMinute: {}, range: { start: '2026-01-01', end: '' } };

  const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? fmt.format(v) : '—');
  const pct = (v) => (typeof v === 'number' && Number.isFinite(v) ? `${v > 0 ? '+' : ''}${v.toFixed(2)}%` : '—');
  const mainLabel = (time) => (time.length <= 10 ? time.slice(5) : time.slice(11));

  function tipHTML(time, point, rows) {
    const body = rows.map(([name, key]) => `<div class="tip-row"><span>${name}</span><b>${num(point[key])}</b></div>`).join('');
    return `<div class="tip"><div class="tip-title">${time}</div>${body}</div>`;
  }

  function mainTip(params) {
    const list = Array.isArray(params) ? params : [params];
    const point = state.points[list[0] && list[0].dataIndex];
    if (!point) return '';
    return tipHTML(point.time, point, [['多头', 'bull'], ['空头', 'bear'], ['指数', 'index'], ['涨跌', 'index_change'], ['阻力', 'resistance'], ['支撑', 'support'], ['追涨', 'chase'], ['抄底', 'bottom'], ['离场', 'exit'], ['恐慌', 'panic'], ['样本', 'total']]);
  }

  function recentTip(params) {
    const list = Array.isArray(params) ? params : [params];
    const point = state.recent[list[0] && list[0].dataIndex];
    if (!point) return '';
    return tipHTML(point.time, point, [['多头', 'bull'], ['空头', 'bear'], ['指数', 'index'], ['涨跌', 'index_change'], ['阻力', 'resistance'], ['支撑', 'support']]);
  }

  function renderMain() {
    const points = state.points;
    const labels = points.map((p) => mainLabel(p.time));
    const el = document.getElementById('chart');
    const small = el.clientWidth < 480;
    const log = state.axis === 'log';
    const axis = {
      type: 'category', data: labels, boundaryGap: false,
      axisLine: { lineStyle: { color: '#26313f' } }, axisTick: { show: false },
      axisPointer: { show: true, snap: true, lineStyle: { color: '#5f7d74', type: 'dashed' }, label: { backgroundColor: '#2b423a', color: '#dfe8f2', fontSize: 10 } }
    };
    chart.setOption({
      backgroundColor: 'transparent', animation: false,
      tooltip: { trigger: 'axis', confine: true, backgroundColor: '#101a25f2', borderColor: '#2c3d50', padding: [8, 11], textStyle: { color: '#dfe8f2', fontSize: 11 }, formatter: mainTip },
      axisPointer: { link: [{ xAxisIndex: [0, 1] }], snap: true },
      grid: [{ left: small ? 42 : 48, right: small ? 44 : 52, top: 16, bottom: 112 }, { left: small ? 42 : 48, right: small ? 44 : 52, height: 62, bottom: 34 }],
      xAxis: [
        { ...axis, gridIndex: 0, axisLabel: { color: '#6f8095', fontSize: 10, show: false } },
        { ...axis, gridIndex: 1, axisLabel: { color: '#6f8095', fontSize: 9, hideOverlap: true, interval: Math.max(0, Math.ceil(labels.length / 6) - 1) } }
      ],
      yAxis: [
        { type: log ? 'log' : 'value', logBase: 10, min: log ? 1 : null, splitNumber: 3, axisLabel: { color: '#6f8095', fontSize: 10, formatter: (v) => compact.format(v) }, splitLine: { lineStyle: { color: '#1c2632', type: 'dashed' } } },
        { type: 'value', position: 'right', scale: true, splitNumber: 3, axisLabel: { color: '#6f8095', fontSize: 10, formatter: (v) => compact.format(v) }, splitLine: { show: false } },
        { type: 'value', gridIndex: 1, min: 0, splitNumber: 2, axisLabel: { color: '#6f8095', fontSize: 9, formatter: (v) => compact.format(v) }, splitLine: { show: false } }
      ],
      dataZoom: [
        { type: 'inside', xAxisIndex: [0, 1], filterMode: 'none', start: 0, end: 100 },
        { type: 'slider', xAxisIndex: [0, 1], filterMode: 'none', bottom: 2, height: 12, left: small ? 42 : 48, right: small ? 44 : 52, borderColor: '#22303f', backgroundColor: '#0a121b', fillerColor: '#3b5a5033', handleStyle: { color: '#5b8a77' }, textStyle: { color: '#6f8095', fontSize: 9 }, showDetail: false, brushSelect: false }
      ],
      series: [
        { name: '多头', type: 'line', data: points.map((p) => (log && !(p.bull > 0) ? null : p.bull)), showSymbol: false, connectNulls: false, lineStyle: { width: 1.6, color: COLORS.bull }, itemStyle: { color: COLORS.bull }, animation: false },
        { name: '空头', type: 'line', data: points.map((p) => (log && !(p.bear > 0) ? null : p.bear)), showSymbol: false, connectNulls: false, lineStyle: { width: 1.6, color: COLORS.bear }, itemStyle: { color: COLORS.bear }, animation: false },
        { name: '指数', type: 'line', yAxisIndex: 1, data: points.map((p) => p.index), showSymbol: false, connectNulls: false, lineStyle: { width: 0.9, color: COLORS.index }, itemStyle: { color: COLORS.index }, animation: false },
        { name: '阻力', type: 'line', xAxisIndex: 1, yAxisIndex: 2, data: points.map((p) => (p.resistance > 0 ? p.resistance : null)), showSymbol: false, connectNulls: false, step: 'end', lineStyle: { width: 1.2, color: COLORS.resistance }, itemStyle: { color: COLORS.resistance }, animation: false },
        { name: '支撑', type: 'line', xAxisIndex: 1, yAxisIndex: 2, data: points.map((p) => (p.support > 0 ? p.support : null)), showSymbol: false, connectNulls: false, step: 'end', lineStyle: { width: 1.2, color: COLORS.support }, itemStyle: { color: COLORS.support }, animation: false }
      ]
    }, { notMerge: true });
  }

  function renderRecent() {
    const labels = state.recent.map((p) => p.time.slice(5));
    recentChart.setOption({
      backgroundColor: 'transparent', animation: false,
      tooltip: { trigger: 'axis', confine: true, backgroundColor: '#101a25f2', borderColor: '#2c3d50', padding: [8, 11], textStyle: { color: '#dfe8f2', fontSize: 11 }, formatter: recentTip },
      grid: { left: 44, right: 48, top: 10, bottom: 18 },
      xAxis: {
        type: 'category', data: labels, boundaryGap: false,
        axisLine: { lineStyle: { color: '#26313f' } }, axisTick: { show: false },
        axisLabel: { color: '#6f8095', fontSize: 10, hideOverlap: true, formatter: (v, i) => (i % 4 === 0 ? v.slice(0, 5) : '') },
        axisPointer: { show: true, snap: true, lineStyle: { color: '#5f7d74', type: 'dashed' }, label: { backgroundColor: '#2b423a', color: '#dfe8f2', fontSize: 10 } }
      },
      yAxis: [
        { type: 'log', logBase: 10, min: 1, splitNumber: 2, axisLabel: { color: '#6f8095', fontSize: 9, formatter: (v) => compact.format(v) }, splitLine: { lineStyle: { color: '#1c2632', type: 'dashed' } } },
        { type: 'value', position: 'right', scale: true, splitNumber: 2, axisLabel: { color: '#6f8095', fontSize: 9, formatter: (v) => compact.format(v) }, splitLine: { show: false } }
      ],
      series: [
        { name: '多头', type: 'line', data: state.recent.map((p) => (p.bull > 0 ? p.bull : null)), showSymbol: false, connectNulls: false, lineStyle: { width: 1.5, color: COLORS.bull }, itemStyle: { color: COLORS.bull }, animation: false },
        { name: '空头', type: 'line', data: state.recent.map((p) => (p.bear > 0 ? p.bear : null)), showSymbol: false, connectNulls: false, lineStyle: { width: 1.5, color: COLORS.bear }, itemStyle: { color: COLORS.bear }, animation: false },
        { name: '指数', type: 'line', yAxisIndex: 1, data: state.recent.map((p) => p.index), showSymbol: false, connectNulls: false, lineStyle: { width: 0.9, color: COLORS.index }, itemStyle: { color: COLORS.index }, animation: false }
      ]
    }, { notMerge: true });
  }

  /* 矩阵定性：先看两组是否全面同向，再看结构（强弱差），最后看整体基调。
     ① 两组同时 ≥+1% → 全面反弹；同时 ≤-1% → 全面走弱（弱势只是跌得更多，仍属全面走弱）；
     ② 否则看强弱差 D=强-弱：D≥0.8 时弱势不跌→强势延续、弱势下跌→两极分化；
        D≤-0.8 时强势不跌→弱势修复、强势下跌且弱势红盘→高低切换、双双下跌→强势补跌；
     ③ |D|<0.8 结构不明显，按整体基调 L=(强+弱)/2：≥0.4 全面反弹，±0.4 内窄幅整理，-1~-0.4 温和退潮，≤-1 全面走弱。 */
  const ND_FULL = 1;
  const ND_DIFF = 0.8;
  const ND_FLAT = 0.4;
  const ND_DEEP = -1;
  const ND_CLASSES = [
    { name: '全面反弹', color: '#ff4d4f' },
    { name: '强势延续', color: '#ff922b' },
    { name: '弱势修复', color: '#ffd43b' },
    { name: '两极分化', color: '#b06aff' },
    { name: '窄幅整理', color: '#8d99ae' },
    { name: '高低切换', color: '#4dabf7' },
    { name: '温和退潮', color: '#69db7c' },
    { name: '强势补跌', color: '#20c997' },
    { name: '全面走弱', color: '#087f5b' }
  ];
  const ND_INDEX = Object.fromEntries(ND_CLASSES.map((item) => [item.name, item]));

  function ndClass(up, down) {
    if (!Number.isFinite(up) || !Number.isFinite(down)) return null;
    if (up >= ND_FULL && down >= ND_FULL) return ND_INDEX['全面反弹'];
    if (up <= -ND_FULL && down <= -ND_FULL) return ND_INDEX['全面走弱'];
    const diff = up - down;
    const base = (up + down) / 2;
    if (diff >= ND_DIFF) return ND_INDEX[down >= 0 ? '强势延续' : '两极分化'];
    if (diff <= -ND_DIFF) {
      if (up >= 0) return ND_INDEX['弱势修复'];
      return ND_INDEX[down > 0 ? '高低切换' : '强势补跌'];
    }
    if (base >= ND_FLAT) return ND_INDEX['全面反弹'];
    if (base > -ND_FLAT) return ND_INDEX['窄幅整理'];
    if (base > ND_DEEP) return ND_INDEX['温和退潮'];
    return ND_INDEX['全面走弱'];
  }

  function ndAlpha(hex, alpha) {
    const value = hex.replace('#', '');
    return `rgba(${parseInt(value.slice(0, 2), 16)},${parseInt(value.slice(2, 4), 16)},${parseInt(value.slice(4, 6), 16)},${alpha})`;
  }

  function ndRow(time) {
    return String(time).length <= 10 ? state.nextdayDaily[String(time).slice(0, 10)] : state.nextdayMinute[time];
  }

  function verdict(row) {
    const cls = ndClass(row.up_ret, row.dn_ret);
    return cls ? `${cls.name} · 强 ${pct(row.up_ret)} / 弱 ${pct(row.dn_ret)}` : '—';
  }

  function renderNextday() {
    const points = state.points;
    if (!points.length) { nextdayChart.clear(); return; }
    const labels = points.map((p) => mainLabel(p.time));
    const el = document.getElementById('chart');
    const small = el.clientWidth < 480;
    const rows = points.map((point) => ndRow(point.time) || null);
    const upData = rows.map((row) => (row && Number.isFinite(row.up_ret) ? row.up_ret : null));
    const dnData = rows.map((row) => (row && Number.isFinite(row.dn_ret) ? row.dn_ret : null));
    const barData = rows.map((row) => {
      if (!row || !Number.isFinite(row.up_ret) || !Number.isFinite(row.dn_ret)) return null;
      return 0.12 + 0.8 * Math.min(1, (Math.abs(row.up_ret) + Math.abs(row.dn_ret)) / 2 / 2.5);
    });
    const barColor = rows.map((row) => {
      const cls = row ? ndClass(row.up_ret, row.dn_ret) : null;
      return ndAlpha(cls ? cls.color : '#3a4a5c', 0.9);
    });
    let lastIndex = -1;
    rows.forEach((row, index) => { if (row) lastIndex = index; });
    const last = lastIndex >= 0 ? rows[lastIndex] : null;
    document.getElementById('nextday-meta').textContent = last ? verdict(last) : '今日暂无（待盘中快照）';
    nextdayChart.setOption({
      backgroundColor: 'transparent', animation: false,
      tooltip: {
        trigger: 'axis', confine: true, backgroundColor: '#101a25f2', borderColor: '#2c3d50',
        padding: [8, 11], textStyle: { color: '#dfe8f2', fontSize: 11 },
        formatter: (params) => {
          const list = Array.isArray(params) ? params : [params];
          const index = list[0] && list[0].dataIndex;
          const row = rows[index];
          if (!row) return '';
          const line = (name, value) => `<div class="tip-row"><span>${name}</span><b>${value}</b></div>`;
          const cls = ndClass(row.up_ret, row.dn_ret);
          return `<div class="tip"><div class="tip-title">${points[index].time.slice(5)}</div>`
            + line('强势组今日', `${pct(row.up_ret)}（${row.up_n} 只）`)
            + line('弱势组今日', `${pct(row.dn_ret)}（${row.dn_n} 只）`)
            + line('强弱差', pct(row.up_ret - row.dn_ret))
            + line('整体基调', pct((row.up_ret + row.dn_ret) / 2))
            + line('定性', cls ? cls.name : '—') + '</div>';
        }
      },
      grid: { left: small ? 42 : 48, right: small ? 44 : 52, top: 6, bottom: 16 },
      dataZoom: [{ type: 'inside', xAxisIndex: [0], filterMode: 'none', start: 0, end: 100 }],
      xAxis: {
        type: 'category', data: labels, boundaryGap: false,
        axisLine: { lineStyle: { color: '#26313f' } }, axisTick: { show: false },
        axisLabel: { color: '#6f8095', fontSize: 9, hideOverlap: true, interval: Math.max(0, Math.ceil(labels.length / 5) - 1) },
        axisPointer: { show: true, snap: true, lineStyle: { color: '#5f7d74', type: 'dashed' }, label: { backgroundColor: '#2b423a', color: '#dfe8f2', fontSize: 10 } }
      },
      yAxis: [
        { type: 'value', min: (v) => Math.min(0, Math.floor(v.min)), max: (v) => Math.max(0, Math.ceil(v.max)), splitNumber: 2,
          axisLabel: { color: '#6f8095', fontSize: 9, formatter: (v) => `${v}%` }, splitLine: { lineStyle: { color: '#1c2632', type: 'dashed' } } },
        { type: 'value', min: 0, max: 1, show: false }
      ],
      series: [
        { name: '定性强度', type: 'bar', yAxisIndex: 1, data: barData, barWidth: '88%',
          itemStyle: { color: (params) => barColor[params.dataIndex] }, animation: false, z: 1 },
        { name: '昨日涨≥2%', type: 'line', data: upData, showSymbol: false, connectNulls: false, lineStyle: { width: 1.1, color: COLORS.bull, opacity: 0.85 }, itemStyle: { color: COLORS.bull }, animation: false, z: 3 },
        { name: '昨日跌≤-2%', type: 'line', data: dnData, showSymbol: false, connectNulls: false, lineStyle: { width: 1.1, color: COLORS.bear, opacity: 0.85 }, itemStyle: { color: COLORS.bear }, animation: false, z: 3 },
        { type: 'line', data: [], animation: false, z: 2,
          markLine: { silent: true, symbol: 'none', label: { show: false }, lineStyle: { color: '#e6edf5', opacity: 0.35, type: 'dashed' }, data: [{ yAxis: 0 }] } }
      ]
    }, { notMerge: true });
  }

  async function loadNextday() {
    try {
      const minuteUrl = IS_LOCAL ? '/api/v1/nextday/intraday?days=10' : NEXTDAY5M_URL;
      const [minute, daily] = await Promise.all([
        fetch(minuteUrl, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
        IS_LOCAL ? fetch('/api/v1/nextday?days=60', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null
      ]);
      if (minute) state.nextdayMin = (minute.rows || []).filter((row) => row && typeof row.time === 'string');
      if (daily) state.nextday = (daily.rows || []).filter((row) => row && typeof row.date === 'string');
      state.nextdayMinute = {};
      state.nextdayMin.forEach((row) => { state.nextdayMinute[row.time] = row; });
      state.nextdayDaily = {};
      state.nextday.forEach((row) => { state.nextdayDaily[row.date] = row; });
      if (state.points.length) {
        renderNextday();
        requestAnimationFrame(() => { chart.resize(); recentChart.resize(); nextdayChart.resize(); });
      }
    } catch (error) {
      /* 取不到保留原图 */
    }
  }

  function apply(payload) {
    state.points = (Array.isArray(payload.points) ? payload.points : []).filter((p) => p && typeof p.time === 'string');
    state.recent = (Array.isArray(payload.recent60) ? payload.recent60 : Array.isArray(payload.recent) ? payload.recent : []).filter((p) => p && typeof p.time === 'string');
    const last = state.points[state.points.length - 1];
    document.getElementById('meta').textContent = last ? `${last.time} · ${state.points.length} 点 · ${clock.format(new Date())} 更新` : '暂无数据，等待下一次推送';
    document.getElementById('points-count').textContent = state.points.length ? `${state.points.length} 点` : '—';
    document.getElementById('main-title').textContent = IS_LOCAL ? `${state.period} · ${state.range.start} — ${state.range.end}` : '今日 5 分钟 · 多空与阻力支撑';
    const days = new Set(state.recent.map((p) => p.time.slice(0, 10))).size;
    document.getElementById('recent-meta').textContent = state.recent.length ? `${days} 个交易日 · ${state.recent.length} 点` : '暂无数据';
    if (state.points.length) renderMain();
    if (state.recent.length) renderRecent();
    renderNextday();
    requestAnimationFrame(() => { chart.resize(); recentChart.resize(); nextdayChart.resize(); });
  }

  function today() {
    const parts = Object.fromEntries(new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map((p) => [p.type, p.value]));
    return `${parts.year}-${parts.month}-${parts.day}`;
  }

  async function load() {
    try {
      if (IS_LOCAL) {
        const start = document.getElementById('start-date').value || '2026-01-01';
        const end = document.getElementById('end-date').value || today();
        state.range = { start, end };
        const query = new URLSearchParams({ period: state.period, start, end });
        const [main, recent] = await Promise.all([
          fetch(`/api/v1/battle?${query}`, { cache: 'no-store' }).then((r) => r.json()),
          fetch('/api/v1/recent?days=5', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ points: [] }))
        ]);
        apply({ points: main.points, recent60: recent.points });
        document.getElementById('meta').textContent += main.meta && main.meta.realtime ? ' · 实时' : '';
      } else {
        const response = await fetch(DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const ranges = payload.ranges || {};
        const all = Array.isArray(payload.points) ? payload.points : [];
        const lastDay = all.length ? all[all.length - 1].time.slice(0, 10) : '';
        payload.points = lastDay ? all.filter((p) => p.time.slice(0, 10) === lastDay) : all;
        let recent = Array.isArray(payload.recent60) && payload.recent60.length ? payload.recent60 : [];
        if (!recent.length && ranges.h60) {
          const list = ranges.h60.points || [];
          const days = [...new Set(list.map((p) => p.time.slice(0, 10)))].slice(-5);
          recent = list.filter((p) => days.includes(p.time.slice(0, 10)));
        }
        payload.recent60 = recent;
        apply(payload);
        document.getElementById('meta').textContent = `${payload.date || ''} · ${document.getElementById('meta').textContent}`;
      }
    } catch (error) {
      document.getElementById('meta').textContent = `读取失败：${error.message}`;
    }
  }

  if (IS_LOCAL) {
    const endInput = document.getElementById('end-date');
    endInput.value = today();
    endInput.max = today();
    const pick = (group, key, value) => {
      document.querySelectorAll(`#${group} button`).forEach((button) => {
        const on = button.dataset[key] === value;
        button.classList.toggle('selected', on);
      });
    };
    document.querySelectorAll('#period-group button').forEach((button) => {
      button.addEventListener('click', () => { state.period = button.dataset.period; pick('period-group', 'period', state.period); load(); });
    });
    document.querySelectorAll('#axis-group button').forEach((button) => {
      button.addEventListener('click', () => { state.axis = button.dataset.axis; pick('axis-group', 'axis', state.axis); if (state.points.length) renderMain(); });
    });
    document.querySelectorAll('#start-date, #end-date').forEach((input) => input.addEventListener('change', load));
  }

  window.addEventListener('resize', () => { chart.resize(); recentChart.resize(); nextdayChart.resize(); });
  window.setInterval(() => { load(); loadNextday(); }, IS_LOCAL ? 60000 : 300000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadNextday(); } });
  load();
  loadNextday();
  }
</script>
</body>
</html>
